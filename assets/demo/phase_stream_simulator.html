<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase Stream Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --mark:#2563eb; --mark-bg:#e8effc; --grid:#eceff2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --mark:#60a5fa; --mark-bg:#14203a; --grid:#1c1c20;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; margin-right:2px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; font-weight:500; padding:9px 13px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:9px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }
  .sp { flex:1 1 6px; }

  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:15px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }

  .track { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:10px 10px 4px; overflow-x:auto; }
  .track svg { display:block; width:100%; min-width:440px; height:auto; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>상태를 바꿨는데 화면은 왜 그대로인가</h1>
<p class="lead">현재 상태(<code>phase</code>)는 위치 데이터 묶음에 얹혀서 나간다. 그런데 그 묶음은 <b>GPS 위치가 들어올 때만</b> 흘러나간다. 그래서 상태를 바꿔도 다음 위치가 올 때까지 화면에는 아무 일도 안 일어난다.</p>

<div class="bar">
  <span>상태 전달</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-mode="ride" aria-pressed="true">위치 묶음에 얹어 보내기</button>
    <button type="button" data-mode="own" aria-pressed="false">상태 전용 통로로 보내기</button>
  </div>
  <span class="sp"></span>
  <button type="button" class="btn" id="reset">처음으로</button>
  <button type="button" class="btn primary" id="fire">지금 MINIMUMS 진입</button>
</div>

<div class="row">
  <div class="cell"><div class="k">실제 상태</div><div class="v" id="v-real">--</div></div>
  <div class="cell"><div class="k">화면·다이나믹 아일랜드</div><div class="v" id="v-ui">--</div></div>
  <div class="cell"><div class="k">반영까지 걸린 시간</div><div class="v" id="v-lag">--</div></div>
</div>

<div class="track"><div id="plot"></div></div>
<div class="note" id="note">"지금 MINIMUMS 진입"을 눌러보자. 걷는 중이라 GPS가 뜸하게 들어오는 상황이다.</div>

<script>
(function () {
  "use strict";
  // 걷는 속도에서 5m를 채우는 데 걸리는 시간. GPS가 이만큼 띄엄띄엄 들어온다.
  var GPS_AT = [0, 3.6, 7.4, 11.1, 15.0, 18.6, 22.3, 26.0];
  var SPAN = 27;
  var mode = "ride", fireAt = null, now = 0, timer = null;

  function uiChangeTime() {
    if (fireAt === null) return null;
    if (mode === "own") return fireAt;
    for (var k = 0; k < GPS_AT.length; k++) if (GPS_AT[k] >= fireAt) return GPS_AT[k];
    return null;
  }

  function draw() {
    var W = 680, H = 128, PL = 14, PR = 14, Y = 62;
    var X = function (t) { return PL + t / SPAN * (W - PL - PR); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="시간 축">';
    s += '<line x1="' + PL + '" y1="' + Y + '" x2="' + (W - PR) + '" y2="' + Y + '" stroke="var(--grid)" stroke-width="2"/>';

    GPS_AT.forEach(function (t) {
      var passed = t <= now;
      s += '<circle cx="' + X(t).toFixed(1) + '" cy="' + Y + '" r="4.5" fill="' + (passed ? "var(--faint)" : "var(--grid)") + '"/>';
    });
    s += '<text x="' + PL + '" y="' + (Y + 26) + '" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">GPS 위치가 들어오는 시점</text>';

    if (fireAt !== null) {
      s += '<line x1="' + X(fireAt).toFixed(1) + '" y1="' + (Y - 34) + '" x2="' + X(fireAt).toFixed(1) + '" y2="' + (Y + 10) + '" stroke="var(--bad)" stroke-width="1.8"/>';
      s += '<text x="' + X(fireAt).toFixed(1) + '" y="' + (Y - 38) + '" text-anchor="middle" font-size="9.5" font-family="Fira Code,monospace" fill="var(--bad)">상태 바뀜</text>';
      var uc = uiChangeTime();
      if (uc !== null) {
        s += '<line x1="' + X(uc).toFixed(1) + '" y1="' + (Y - 34) + '" x2="' + X(uc).toFixed(1) + '" y2="' + (Y + 10) + '" stroke="var(--mark)" stroke-width="1.8"/>';
        s += '<text x="' + X(uc).toFixed(1) + '" y="' + (Y - 38) + '" text-anchor="middle" font-size="9.5" font-family="Fira Code,monospace" fill="var(--mark)">화면 바뀜</text>';
        if (uc > fireAt) {
          s += '<rect x="' + X(fireAt).toFixed(1) + '" y="' + (Y - 10) + '" width="' + (X(uc) - X(fireAt)).toFixed(1) + '" height="20" fill="var(--bad)" opacity="0.16"/>';
          s += '<text x="' + ((X(fireAt) + X(uc)) / 2).toFixed(1) + '" y="' + (Y + 4) + '" text-anchor="middle" font-size="9" font-weight="700" font-family="Fira Code,monospace" fill="var(--bad)">' + (uc - fireAt).toFixed(1) + '초</text>';
        }
      }
    }
    // 현재 시각
    s += '<line x1="' + X(now).toFixed(1) + '" y1="' + (Y - 20) + '" x2="' + X(now).toFixed(1) + '" y2="' + (Y + 20) + '" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 2"/>';
    s += '</svg>';
    document.getElementById("plot").innerHTML = s;
  }

  function render() {
    var uc = uiChangeTime();
    var realState = (fireAt !== null && now >= fireAt) ? "APPROACH" : "CRUISE";
    var uiState = (uc !== null && now >= uc) ? "APPROACH" : "CRUISE";
    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-real", realState, realState === "APPROACH" ? "good" : "");
    set("v-ui", uiState, (realState !== uiState) ? "alarm" : (uiState === "APPROACH" ? "good" : ""));
    set("v-lag", uc === null ? "--" : (uc - fireAt).toFixed(1) + "초", (uc !== null && uc - fireAt > 0.5) ? "alarm" : (uc !== null ? "good" : ""));
    draw();

    var note = document.getElementById("note");
    if (fireAt === null) { note.className = "note"; note.textContent = '"지금 MINIMUMS 진입"을 눌러보자. 걷는 중이라 GPS가 뜸하게 들어오는 상황이다.'; return; }
    if (mode === "ride") {
      note.className = "note alarm";
      note.innerHTML = "상태는 바로 바뀌었는데 화면은 <b>" + (uc - fireAt).toFixed(1) + "초 뒤</b>, 그러니까 다음 GPS 위치가 들어오고 나서야 바뀐다. " +
        "그동안 다이나믹 아일랜드는 이전 상태를 그대로 보여준다. 위치는 <code>distanceFilter</code>만큼 움직여야 오니까, <b>걸으면 이 지연이 더 길어진다.</b>";
    } else {
      note.className = "note fine";
      note.innerHTML = "상태를 전용 통로로 따로 흘려보내면 GPS와 무관하게 <b>바뀌는 즉시</b> 화면에 닿는다. " +
        "위치 데이터와 상태는 바뀌는 계기가 다르니, 같은 통로에 태울 이유가 없었던 것이다.";
    }
  }

  function stop(){ if(timer){clearInterval(timer);timer=null;} }
  document.getElementById("fire").addEventListener("click", function () {
    stop(); fireAt = 5.2; now = 5.2; render();
    timer = setInterval(function () {
      now = Math.min(SPAN, now + 0.4);
      if (now >= 13) stop();
      render();
    }, 70);
  });
  document.getElementById("reset").addEventListener("click", function () { stop(); fireAt = null; now = 0; render(); });
  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      stop(); mode = b.dataset.mode; fireAt = null; now = 0;
      document.querySelectorAll("#seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
