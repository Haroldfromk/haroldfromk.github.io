<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Transfer Method Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --mark:#2563eb; --mark-bg:#e8effc; --queue:#b45309; --queue-bg:#fdf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --mark:#60a5fa; --mark-bg:#14203a; --queue:#fbbf24; --queue-bg:#2e2410;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; margin-right:2px; min-width:62px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex-wrap:wrap; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11px; font-weight:500; padding:9px 11px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:9px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }
  .sp { flex:1 1 6px; }

  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:16px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:600px){ .cols{grid-template-columns:1fr;} }
  .box { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 12px; }
  .box h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 9px; font-weight:500; }
  .log { display:flex; flex-direction:column; gap:4px; min-height:104px; }
  .log div { font-family:'Fira Code',monospace; font-size:11px; padding:4px 8px; border-radius:5px;
    background:var(--bg); border:1px solid var(--line); color:var(--dim); }
  .log .drop { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .log .queued { border-color:var(--queue); background:var(--queue-bg); color:var(--queue); }
  .log .ok { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .log .none { color:var(--faint); border-style:dashed; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>상대 앱이 꺼져 있으면 어떻게 되나</h1>
<p class="lead">워치에서 아이폰으로 데이터를 보내는 방법이 여러 가지인데, 갈리는 지점은 하나다. <b>받는 쪽 앱이 지금 살아 있어야 하는가.</b> 아래에서 상대를 꺼놓고 보내보면 방식마다 결과가 다르다.</p>

<div class="bar">
  <span>보내는 방식</span>
  <div class="seg" id="seg-m">
    <button type="button" data-m="send" aria-pressed="true">sendMessage</button>
    <button type="button" data-m="userinfo" aria-pressed="false">transferUserInfo</button>
    <button type="button" data-m="context" aria-pressed="false">updateApplicationContext</button>
  </div>
</div>
<div class="bar">
  <span>아이폰 앱</span>
  <div class="seg" id="seg-s">
    <button type="button" data-s="1" aria-pressed="true">실행 중</button>
    <button type="button" class="danger" data-s="0" aria-pressed="false">꺼져 있음</button>
  </div>
  <span class="sp"></span>
  <button type="button" class="btn" id="reset">처음으로</button>
  <button type="button" class="btn primary" id="send">데이터 보내기</button>
</div>

<div class="row">
  <div class="cell"><div class="k">보낸 횟수</div><div class="v" id="v-sent">--</div></div>
  <div class="cell"><div class="k">도착</div><div class="v" id="v-got">--</div></div>
  <div class="cell"><div class="k">사라짐</div><div class="v" id="v-lost">--</div></div>
</div>

<div class="cols">
  <div class="box"><h2>워치가 보낸 것</h2><div class="log" id="log-out"></div></div>
  <div class="box"><h2>아이폰에 도착한 것</h2><div class="log" id="log-in"></div></div>
</div>
<div class="note" id="note"></div>

<script>
(function () {
  "use strict";
  var mode = "send", alive = true, sent = [], n = 0;

  function classify(item) {
    if (item.mode === "send") return item.alive ? "ok" : "drop";
    return "queued";   // userinfo / context 는 일단 큐나 보관함에 들어간다
  }

  function delivered() {
    if (mode === "send") return sent.filter(function (x) { return x.alive; });
    if (mode === "userinfo") return sent.slice();               // 전부 순서대로 도착
    return sent.length ? [sent[sent.length - 1]] : [];          // 마지막 하나만 남음
  }

  function fill(el, arr, kind) {
    if (!arr.length) { el.innerHTML = '<div class="none">아직 없음</div>'; return; }
    el.innerHTML = arr.slice(-4).map(function (x) {
      var cls = kind === "out" ? classify(x) : "ok";
      var tail = kind === "out"
        ? (x.mode === "send" ? (x.alive ? " · 바로 전달" : " · 버려짐") : (x.alive ? " · 바로 전달" : " · 큐에 대기"))
        : "";
      return '<div class="' + cls + '">심박 ' + x.hr + 'bpm' + tail + '</div>';
    }).join("");
    if (arr.length > 4) el.insertAdjacentHTML("afterbegin", '<div class="none">앞의 ' + (arr.length - 4) + '개 생략</div>');
  }

  function render() {
    var got = delivered();
    var lost = sent.length - got.length;
    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-sent", sent.length + "회");
    set("v-got", got.length + "개", got.length ? "good" : "");
    set("v-lost", lost + "개" + (mode === "context" && lost ? " (덮어씀)" : ""), (lost && mode === "send") ? "alarm" : (lost ? "" : "good"));

    fill(document.getElementById("log-out"), sent, "out");
    fill(document.getElementById("log-in"), got, "in");

    var note = document.getElementById("note");
    if (!sent.length) { note.className = "note"; note.textContent = '"데이터 보내기"를 눌러보자. 아이폰 앱을 꺼놓고도 보내보면 차이가 보인다.'; return; }
    if (mode === "send") {
      if (alive) {
        note.className = "note fine";
        note.innerHTML = "<code>sendMessage</code>는 <b>지금 바로</b> 꽂아준다. 상대가 살아 있으니 보낸 게 전부 도착했다. 실시간 심박처럼 <b>최신 값만 의미 있는 데이터</b>에 맞는 방식이다.";
      } else {
        note.className = "note alarm";
        note.innerHTML = "상대가 꺼져 있으니 보낸 " + sent.length + "개가 <b>그대로 버려졌다.</b> 에러를 받지 않으면 보낸 쪽은 실패한 줄도 모른다. " +
          "심박처럼 1초 뒤에 또 보낼 값이면 괜찮지만, <b>러닝 기록처럼 한 번뿐인 데이터를 이걸로 보내면 안 된다.</b>";
      }
    } else if (mode === "userinfo") {
      note.className = "note fine";
      note.innerHTML = "<code>transferUserInfo</code>는 시스템 큐에 쌓아뒀다가 <b>상대가 살아날 때 순서대로</b> 전달한다. " +
        (alive ? "지금은 살아 있어서 바로 갔다." : "지금은 꺼져 있지만 " + sent.length + "개가 큐에 남아서 나중에 전부 도착한다.") +
        " 대신 <b>시뮬레이터에서는 아예 동작하지 않아서</b> 실기기로만 확인할 수 있다.";
    } else {
      note.className = "note";
      note.innerHTML = "<code>updateApplicationContext</code>는 <b>덮어쓰기</b>다. " + sent.length + "번 보냈는데 도착하는 건 마지막 하나뿐이다. " +
        "중간 값이 필요 없고 <b>최신 상태만 맞추면 되는 경우</b>에 쓴다. 러닝 중 심박 하나하나를 이걸로 보내면 중간이 다 날아간다.";
    }
  }

  document.getElementById("send").addEventListener("click", function () {
    if (sent.length >= 9) return;
    n++;
    sent.push({ hr: 138 + (n * 3) % 17, alive: alive, mode: mode });
    render();
  });
  document.getElementById("reset").addEventListener("click", function () { sent = []; n = 0; render(); });
  function wire(sel, fn) {
    document.querySelectorAll(sel + " button").forEach(function (b) {
      b.addEventListener("click", function () {
        fn(b); sent = []; n = 0;
        document.querySelectorAll(sel + " button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        render();
      });
    });
  }
  wire("#seg-m", function (b) { mode = b.dataset.m; });
  wire("#seg-s", function (b) { alive = b.dataset.s === "1"; });
  render();
})();
</script>
</body>
</html>
