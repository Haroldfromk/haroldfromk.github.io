<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Announce Channel Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --mark:#2563eb; --mark-bg:#e8effc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --mark:#60a5fa; --mark-bg:#14203a;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; margin-right:2px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; font-weight:500; padding:9px 13px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:9px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }
  .sp { flex:1 1 6px; }

  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:16px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  @media (max-width:520px){ .row{grid-template-columns:repeat(3,1fr);} .cell .v{font-size:14px;} }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:600px){ .cols{grid-template-columns:1fr;} }
  .box { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 12px; }
  .box h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 9px; font-weight:500; }
  .list { display:flex; flex-direction:column; gap:5px; min-height:104px; }
  .item { font-family:'Fira Code',monospace; font-size:11.5px; padding:5px 9px; border-radius:6px;
    background:var(--bg); border:1px solid var(--line); display:flex; gap:8px; align-items:baseline; }
  .item .n { font-weight:600; color:var(--mark); min-width:20px; }
  .item .t { color:var(--dim); }
  .item.say { background:var(--mark-bg); border-color:transparent; }
  .item.bogus { background:var(--bad-bg); border-color:var(--bad); }
  .item.bogus .n { color:var(--bad); }
  .empty { font-size:11.5px; color:var(--faint); font-family:'Fira Code',monospace; padding:5px 2px; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>안내 방송을 어느 통로로 내보낼 것인가</h1>
<p class="lead">1km를 채울 때마다 그 구간 기록을 읽어줘야 한다. 이미 스플릿을 꺼내는 함수(<code>allSplits()</code>)가 있으니 그걸 계속 불러서 새 스플릿이 생겼는지 확인하면 될 것 같지만, 이 함수는 <b>부를 때마다 남은 자투리 구간을 스플릿으로 확정해버린다.</b></p>

<div class="bar">
  <span>안내 통로</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-mode="reuse" aria-pressed="true">allSplits() 계속 확인</button>
    <button type="button" data-mode="stream" aria-pressed="false">알림용 통로 따로</button>
  </div>
  <span class="sp"></span>
  <button type="button" class="btn" id="reset">처음으로</button>
  <button type="button" class="btn" id="step">한 걸음</button>
  <button type="button" class="btn primary" id="play">재생</button>
</div>

<div class="row">
  <div class="cell"><div class="k">누적 거리</div><div class="v" id="v-dist">--</div></div>
  <div class="cell"><div class="k">저장될 스플릿</div><div class="v" id="v-saved">--</div></div>
  <div class="cell"><div class="k">잘못된 안내</div><div class="v" id="v-wrong">--</div></div>
</div>

<div class="cols">
  <div class="box">
    <h2>저장될 스플릿 목록</h2>
    <div class="list" id="saved"></div>
  </div>
  <div class="box">
    <h2>귀에 들리는 안내</h2>
    <div class="list" id="said"></div>
  </div>
</div>
<div class="note" id="note">재생을 누르면 위치가 하나씩 들어온다.</div>

<script>
(function () {
  "use strict";
  var MOVES = [280, 300, 260, 320, 290, 310, 240, 300, 280, 320, 260, 290, 310, 270, 300];
  var UNIT = 1000, TAIL_MIN = 100;

  var mode = "reuse", i = -1, timer = null;

  // allSplits() 를 흉내낸다. 남은 자투리가 100m 이상이면 그걸 스플릿으로 확정하고 번호를 하나 쓴다.
  function simulate(upto) {
    var dist = 0, startAt = 0, idx = 0;
    var saved = [], said = [], wrong = 0;

    for (var k = 0; k <= upto; k++) {
      dist += MOVES[k];

      // 1km 경계를 넘겼으면 정상 스플릿을 확정한다 (두 방식 공통)
      while (dist - startAt >= UNIT) {
        idx++;
        saved.push({ n: idx, label: "1.00km 구간", bogus: false });
        if (mode === "stream") said.push({ n: idx, text: idx + "킬로미터, 페이스 5분 42초", bogus: false });
        startAt += UNIT;
      }

      if (mode === "reuse") {
        // 새 스플릿이 생겼는지 확인하려고 매 업데이트마다 allSplits() 를 부른다
        var tail = dist - startAt;
        if (tail >= TAIL_MIN) {
          idx++;
          saved.push({ n: idx, label: (tail / 1000).toFixed(2) + "km 자투리", bogus: true });
          said.push({ n: idx, text: idx + "킬로미터, 페이스 측정 불가", bogus: true });
          wrong++;
          startAt = dist;         // 자투리를 확정했으니 다음 구간은 여기서 다시 시작한다
        }
      }
    }
    return { dist: dist, saved: saved, said: said, wrong: wrong, idx: idx };
  }

  function fill(el, arr, kind) {
    if (!arr.length) { el.innerHTML = '<div class="empty">아직 없음</div>'; return; }
    var view = arr.slice(-4);
    el.innerHTML = view.map(function (x) {
      var cls = "item" + (x.bogus ? " bogus" : (kind === "say" ? " say" : ""));
      var body = kind === "say" ? x.text : x.label;
      return '<div class="' + cls + '"><span class="n">' + x.n + '</span><span class="t">' + body + '</span></div>';
    }).join("");
    if (arr.length > 4) el.insertAdjacentHTML("afterbegin", '<div class="empty">앞의 ' + (arr.length - 4) + '개 생략</div>');
  }

  function render() {
    var st = i >= 0 ? simulate(i) : { dist: 0, saved: [], said: [], wrong: 0, idx: 0 };
    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-dist", (st.dist / 1000).toFixed(2) + " km");
    set("v-saved", st.saved.length + "개");
    set("v-wrong", st.wrong + "번", st.wrong ? "alarm" : "");
    fill(document.getElementById("saved"), st.saved, "saved");
    fill(document.getElementById("said"), st.said, "say");

    var note = document.getElementById("note");
    if (i < 0) { note.className = "note"; note.textContent = "재생을 누르면 위치가 하나씩 들어온다."; return; }
    if (mode === "stream") {
      note.className = "note fine";
      note.innerHTML = "스플릿이 <b>실제로 완성되는 그 줄에서만</b> 신호를 한 번 흘려보낸다. 저장용 목록은 그대로 쌓이고, 안내는 1km마다 정확히 한 번씩만 나온다.";
    } else if (st.wrong === 0) {
      note.className = "note";
      note.innerHTML = "아직 자투리가 100m를 못 넘겨서 아무 일도 안 일어났다. 조금만 더 가보자.";
    } else {
      note.className = "note alarm";
      note.innerHTML = "확인하려고 부른 것뿐인데 <b>부를 때마다 자투리가 스플릿으로 확정</b>됐다. 번호까지 같이 써버려서, " +
        (st.dist / 1000).toFixed(2) + "km를 뛴 지금 안내는 이미 <b>" + st.idx + "킬로미터</b>라고 말하고 있다. 저장되는 기록도 같이 망가진다.";
    }
  }

  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("play").textContent="재생"; }
  function step(){ if(i>=MOVES.length-1){stop();return;} i++; render(); }
  document.getElementById("step").addEventListener("click",function(){stop();step();});
  document.getElementById("reset").addEventListener("click",function(){stop();i=-1;render();});
  document.getElementById("play").addEventListener("click",function(){
    if(timer){stop();return;}
    if(i>=MOVES.length-1) i=-1;
    this.textContent="일시정지"; step(); timer=setInterval(step,750);
  });
  document.querySelectorAll("#seg button").forEach(function(b){
    b.addEventListener("click",function(){
      mode=b.dataset.mode;
      document.querySelectorAll("#seg button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
