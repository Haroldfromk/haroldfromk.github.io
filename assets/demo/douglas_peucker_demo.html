<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #141a22;
    --border: #2a3542;
    --muted: #8a95a3;
    --text: #c7d0da;
    --cyan: #3fe6c4;
    --amber: #ffb454;
    --red: #ff6b6b;
    --pink: #ff6ec7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 20px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 {
    font-size: 15px;
    color: var(--cyan);
    letter-spacing: 0.5px;
    margin: 0 0 14px;
    font-weight: 700;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .controls input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--cyan); }
  .tol-value { font-size: 13px; font-weight: 700; color: var(--cyan); min-width: 56px; text-align: right; }
  button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #1c2530;
    color: var(--text);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.play { border-color: #1f6f5c; color: var(--cyan); margin-left: auto; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  svg { width: 100%; height: auto; display: block; }

  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat {
    flex: 1;
    background: #1c2530;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .stat b { display: block; font-size: 16px; margin-top: 2px; color: var(--cyan); }

  .caption { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 8px; text-align: center; }
  .caption b { color: var(--text); }
  .caption b.amber { color: var(--amber); }
  .caption b.cyan { color: var(--cyan); }

  .note { font-size: 11px; color: #5b6b7d; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Douglas-Peucker 경로 단순화 — 직접 눌러보는 시각화</h1>

  <div class="controls">
    <label for="tolSlider">기준 거리(허용 오차)</label>
    <input type="range" id="tolSlider" min="2" max="40" step="1" value="8">
    <span class="tol-value" id="tolValue">8px</span>
    <button class="play" id="playBtn">단계별로 재생</button>
  </div>

  <div class="panel">
    <div class="stat-row">
      <div class="stat">원본 좌표 수<b id="originalCount">0</b></div>
      <div class="stat">남은 좌표 수<b id="keptCount">0</b></div>
    </div>
    <svg id="stage" viewBox="0 0 620 300"></svg>
    <div class="caption" id="caption">기준 거리를 조절하거나 "단계별로 재생"을 눌러보세요.</div>
  </div>

  <div class="note">
    회색 점 = 원본 좌표, 파란 굵은 선 = 단순화 후 남은 경로. 재생을 누르면 알고리즘이 어떤 점을 왜 남기고 버리는지 한 단계씩 보여줍니다. 직선에 가까운 구간은 점이 확 줄고, 코너/커브 구간은 모양을 지키려고 점이 더 많이 남는 걸 확인할 수 있습니다.
  </div>
</div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('stage');
  const tolSlider = document.getElementById('tolSlider');
  const tolValue = document.getElementById('tolValue');
  const playBtn = document.getElementById('playBtn');
  const originalCountEl = document.getElementById('originalCount');
  const keptCountEl = document.getElementById('keptCount');
  const caption = document.getElementById('caption');

  // 고정된 예시 러닝 경로: 살짝 흔들리는 직선 구간 + 코너(커브) 구간 + 직선 구간
  const points = [
    [40,260],[58,255],[76,258],[94,250],[112,253],[130,246],[148,249],[166,242],[184,245],[202,238],[220,232],[238,228],
    [255,205],[270,185],[288,168],[308,152],[330,138],[352,122],[374,108],[396,96],[418,88],
    [438,84],[458,87],[478,82],[498,85],[518,80],[538,83],[558,78],[578,80]
  ];

  function perpDist(pt, a, b) {
    const [x, y] = pt, [x1, y1] = a, [x2, y2] = b;
    const dx = x2 - x1, dy = y2 - y1;
    if (dx === 0 && dy === 0) return Math.hypot(x - x1, y - y1);
    const t = ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy);
    const clampedT = Math.max(0, Math.min(1, t));
    const projX = x1 + clampedT * dx, projY = y1 + clampedT * dy;
    return { dist: Math.hypot(x - projX, y - projY), proj: [projX, projY] };
  }

  // 애니메이션용: 최종 결과가 아니라 "어떤 순서로 어떤 점을 검사했는지"를 단계 목록으로 만든다
  function buildSteps(pts, tolerance) {
    const steps = [];
    const keep = new Set([0, pts.length - 1]);
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [s, e] = stack.pop();
      if (e - s < 2) continue;
      let maxDist = -1, maxIdx = -1, maxProj = null;
      for (let i = s + 1; i < e; i++) {
        const r = perpDist(pts[i], pts[s], pts[e]);
        if (r.dist > maxDist) { maxDist = r.dist; maxIdx = i; maxProj = r.proj; }
      }
      const kept = maxDist > tolerance;
      steps.push({ s, e, maxIdx, maxDist, proj: maxProj, kept });
      if (kept) {
        keep.add(maxIdx);
        stack.push([s, maxIdx]);
        stack.push([maxIdx, e]);
      }
    }
    return steps;
  }

  function finalKeptIndices(pts, tolerance) {
    const steps = buildSteps(pts, tolerance);
    const keep = new Set([0, pts.length - 1]);
    steps.forEach(st => { if (st.kept) keep.add(st.maxIdx); });
    return [...keep].sort((a, b) => a - b);
  }

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function pathD(idxList) {
    return idxList.map((i, k) => (k === 0 ? 'M' : 'L') + points[i][0] + ',' + points[i][1]).join(' ');
  }

  let removedSet = new Set();
  let keptSet = new Set();
  let checkingLayer = null;

  function renderBase() {
    svg.innerHTML = '';
    originalCountEl.textContent = points.length;

    // 원본 옅은 선
    svg.appendChild(el('path', {
      d: pathD(points.map((_, i) => i)),
      fill: 'none', stroke: '#2a3542', 'stroke-width': 1.5
    }));

    // 원본 점들
    points.forEach((p, i) => {
      svg.appendChild(el('circle', {
        cx: p[0], cy: p[1], r: 4, fill: '#3a4656', stroke: '#5b6b7d', 'stroke-width': 1,
        id: 'pt-' + i
      }));
    });

    checkingLayer = el('g', { id: 'checking-layer' });
    svg.appendChild(checkingLayer);
  }

  function showFinal(tolerance) {
    renderBase();
    const kept = finalKeptIndices(points, tolerance);
    svg.appendChild(el('path', {
      d: pathD(kept),
      fill: 'none', stroke: 'var(--cyan)', 'stroke-width': 3, 'stroke-linejoin': 'round'
    }));
    kept.forEach(i => {
      const c = document.getElementById('pt-' + i);
      if (c) { c.setAttribute('fill', 'var(--cyan)'); c.setAttribute('stroke', 'var(--cyan)'); c.setAttribute('r', 5); }
    });
    keptCountEl.textContent = kept.length;
    caption.innerHTML = `기준 거리 <b class="cyan">${tolerance}px</b> — 원본 ${points.length}개 중 <b class="cyan">${kept.length}개</b>만 남기면 거의 같은 모양이 나옵니다.`;
  }

  function updateTolLabel() {
    tolValue.textContent = tolSlider.value + 'px';
  }

  tolSlider.addEventListener('input', () => {
    updateTolLabel();
    showFinal(parseInt(tolSlider.value, 10));
  });

  updateTolLabel();
  showFinal(parseInt(tolSlider.value, 10));

  function play() {
    playBtn.disabled = true;
    tolSlider.disabled = true;
    const tolerance = parseInt(tolSlider.value, 10);
    renderBase();
    keptCountEl.textContent = '2';
    const kept = new Set([0, points.length - 1]);
    [0, points.length - 1].forEach(i => {
      const c = document.getElementById('pt-' + i);
      c.setAttribute('fill', 'var(--cyan)'); c.setAttribute('stroke', 'var(--cyan)'); c.setAttribute('r', 5);
    });

    const steps = buildSteps(points, tolerance);
    let idx = 0;

    function step() {
      checkingLayer.innerHTML = '';
      if (idx >= steps.length) {
        // 완료: 최종 경로 그리기
        const sortedKept = [...kept].sort((a, b) => a - b);
        svg.appendChild(el('path', {
          d: pathD(sortedKept),
          fill: 'none', stroke: 'var(--cyan)', 'stroke-width': 3, 'stroke-linejoin': 'round'
        }));
        caption.innerHTML = `완료 — 원본 ${points.length}개 중 <b class="cyan">${sortedKept.length}개</b>만 남았습니다.`;
        playBtn.disabled = false;
        tolSlider.disabled = false;
        return;
      }

      const st = steps[idx];
      // 기준선(양 끝을 잇는 직선)
      checkingLayer.appendChild(el('line', {
        x1: points[st.s][0], y1: points[st.s][1], x2: points[st.e][0], y2: points[st.e][1],
        stroke: 'var(--amber)', 'stroke-width': 1.5, 'stroke-dasharray': '5,4'
      }));

      if (st.maxIdx !== -1) {
        // 기준선에서 가장 멀리 떨어진 점까지 수선
        checkingLayer.appendChild(el('line', {
          x1: points[st.maxIdx][0], y1: points[st.maxIdx][1], x2: st.proj[0], y2: st.proj[1],
          stroke: 'var(--red)', 'stroke-width': 1.5, 'stroke-dasharray': '3,3'
        }));
        const c = document.getElementById('pt-' + st.maxIdx);
        c.setAttribute('r', 6);
        c.setAttribute('fill', st.kept ? 'var(--amber)' : '#5b6b7d');

        caption.innerHTML = st.kept
          ? `가장 멀리 벗어난 점까지 거리 <b class="amber">${st.maxDist.toFixed(1)}px</b> — 기준(${tolerance}px)보다 머니까 <b class="cyan">남긴다</b>`
          : `가장 멀리 벗어난 점까지 거리 <b class="amber">${st.maxDist.toFixed(1)}px</b> — 기준(${tolerance}px)보다 가까우니 이 구간 전부 <b>버린다</b>`;
      }

      setTimeout(() => {
        if (st.maxIdx !== -1) {
          const c = document.getElementById('pt-' + st.maxIdx);
          if (st.kept) {
            kept.add(st.maxIdx);
            c.setAttribute('fill', 'var(--cyan)'); c.setAttribute('stroke', 'var(--cyan)');
            keptCountEl.textContent = kept.size;
          } else {
            for (let i = st.s + 1; i < st.e; i++) {
              const cc = document.getElementById('pt-' + i);
              cc.setAttribute('fill', '#232b35'); cc.setAttribute('stroke', '#2a3542'); cc.setAttribute('r', 3);
            }
          }
        }
        idx++;
        setTimeout(step, 250);
      }, 900);
    }

    step();
  }

  playBtn.addEventListener('click', play);
</script>
</body>
</html>
