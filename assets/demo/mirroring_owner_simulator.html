<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirroring Owner Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --mark:#2563eb; --grid:#eceff2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --mark:#60a5fa; --grid:#1c1c20;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }
  .caveat { font-size:11.5px; color:var(--faint); margin:-8px 0 14px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; margin-right:2px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; font-weight:500; padding:9px 13px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:9px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }
  .sp { flex:1 1 6px; }

  .devs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .dev { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 12px; }
  .dev h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 8px; font-weight:500; display:flex; justify-content:space-between; }
  .dev .big { font-family:'Fira Code',monospace; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .dev .sub { font-family:'Fira Code',monospace; font-size:10.5px; color:var(--faint); margin-top:4px; }
  .tag { font-family:'Fira Code',monospace; font-size:9px; padding:2px 6px; border-radius:4px;
    border:1px solid var(--line); color:var(--faint); }
  .tag.gps { border-color:var(--ok); color:var(--ok); }
  .tag.recv { border-color:var(--mark); color:var(--mark); }

  .row { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:16px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }

  .track { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:10px 10px 4px; overflow-x:auto; }
  .track svg { display:block; width:100%; min-width:440px; height:auto; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>누가 거리를 계산할 것인가</h1>
<p class="lead">워치에서 러닝을 시작했는데 아이폰도 자기 GPS를 따로 돌리면, 같은 러닝인데 <b>두 기기가 각자 계산한 숫자를 보여준다.</b> 게다가 아이폰은 위성을 새로 잡느라 몇 초 늦게 출발한다.</p>
<p class="caveat">GPS 락에 걸리는 시간과 기기별 오차는 모형 값이다. 벌어지는 구조를 보여주는 게 목적이다.</p>

<div class="bar">
  <span>계산 주체</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-m="both" aria-pressed="true">양쪽이 각자 계산</button>
    <button type="button" data-m="owner" aria-pressed="false">시작한 쪽만 계산해서 전달</button>
  </div>
  <span class="sp"></span>
  <button type="button" class="btn" id="reset">처음으로</button>
  <button type="button" class="btn primary" id="play">워치에서 시작하기</button>
</div>

<div class="devs">
  <div class="dev">
    <h2><span>워치 (시작한 쪽)</span><span class="tag gps" id="t-w">GPS 켬</span></h2>
    <div class="big" id="v-w">0.00 km</div>
    <div class="sub" id="s-w">--</div>
  </div>
  <div class="dev">
    <h2><span>아이폰 (받는 쪽)</span><span class="tag" id="t-p">--</span></h2>
    <div class="big" id="v-p">0.00 km</div>
    <div class="sub" id="s-p">--</div>
  </div>
</div>

<div class="row">
  <div class="cell"><div class="k">두 화면의 차이</div><div class="v" id="v-gap">--</div></div>
  <div class="cell"><div class="k">저장될 기록</div><div class="v" id="v-save">--</div></div>
</div>

<div class="track"><div id="plot"></div></div>
<div class="note" id="note">시작 버튼을 눌러보자.</div>

<script>
(function () {
  "use strict";
  var DUR = 240;            // 4분
  var LOCK = 7;             // 아이폰이 위성을 새로 잡는 데 걸리는 시간(초)
  var V = 2.9;              // m/s
  var BIAS = 0.018;         // 기기별 거리 계산 오차(0.018 = 1.8%)
  var mode = "both", t = -1, timer = null;

  function watchKm(s) { return Math.max(0, s) * V / 1000; }
  function phoneOwnKm(s) { return Math.max(0, s - LOCK) * V * (1 - BIAS) / 1000; }

  function phoneKm(s) {
    if (s < 0) return 0;
    return mode === "both" ? phoneOwnKm(s) : watchKm(s);
  }

  function render() {
    var w = t < 0 ? 0 : watchKm(t);
    var p = t < 0 ? 0 : phoneKm(t);
    var gap = Math.abs(w - p);

    document.getElementById("v-w").textContent = w.toFixed(2) + " km";
    document.getElementById("v-p").textContent = p.toFixed(2) + " km";
    document.getElementById("s-w").textContent = t < 0 ? "--" : "직접 GPS로 계산";
    document.getElementById("s-p").textContent = t < 0 ? "--"
      : (mode === "both"
          ? (t < LOCK ? "위성 잡는 중 (" + (LOCK - t) + "초 남음)" : "따로 GPS로 계산")
          : "워치가 보낸 값을 그대로 표시");
    var tp = document.getElementById("t-p");
    tp.textContent = mode === "both" ? "GPS 켬" : "받기만 함";
    tp.className = "tag " + (mode === "both" ? "gps" : "recv");

    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-gap", (gap * 1000).toFixed(0) + " m", gap > 0.02 ? "alarm" : "good");
    set("v-save", mode === "both" ? "두 값 중 뭐가 맞는지 모름" : "하나뿐이라 고민 없음",
        mode === "both" ? "alarm" : "good");

    var W = 660, H = 150, PL = 34, PR = 10, PT = 12, PB = 24;
    var maxKm = DUR * V / 1000;
    var X = function (s) { return PL + s / DUR * (W - PL - PR); };
    var Y = function (v) { return PT + (maxKm - v) / maxKm * (H - PT - PB); };
    var s2 = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="두 기기의 거리">';
    for (var g = 0; g <= 0.6; g += 0.2) {
      s2 += '<line x1="' + PL + '" y1="' + Y(g).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(g).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
      s2 += '<text x="' + (PL - 6) + '" y="' + (Y(g) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">' + g.toFixed(1) + '</text>';
    }
    if (mode === "both") {
      s2 += '<rect x="' + PL + '" y="' + PT + '" width="' + (X(LOCK) - PL).toFixed(1) + '" height="' + (H - PT - PB) + '" fill="var(--bad)" opacity="0.1"/>';
      s2 += '<text x="' + (X(LOCK) + 5).toFixed(1) + '" y="' + (PT + 11) + '" font-size="9" font-family="Fira Code,monospace" fill="var(--bad)">아이폰이 위성 잡는 중</text>';
    }
    var end = t < 0 ? 0 : t;
    function line(f, color, w2) {
      var pts = [];
      for (var s3 = 0; s3 <= end; s3 += 2) pts.push(X(s3).toFixed(1) + ',' + Y(f(s3)).toFixed(1));
      return pts.length ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="' + w2 + '"/>' : '';
    }
    s2 += line(watchKm, "var(--ok)", 2.4);
    s2 += line(phoneKm, "var(--mark)", mode === "both" ? 2 : 1.2);
    s2 += '<text x="' + PL + '" y="' + (H - 7) + '" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">0초</text>';
    s2 += '<text x="' + (W - PR) + '" y="' + (H - 7) + '" text-anchor="end" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">4분</text>';
    s2 += '</svg>';
    document.getElementById("plot").innerHTML = s2;

    var note = document.getElementById("note");
    if (t < 0) { note.className = "note"; note.textContent = "시작 버튼을 눌러보자."; return; }
    if (mode === "both") {
      note.className = "note alarm";
      note.innerHTML = "같은 러닝인데 손목과 손에 든 화면의 숫자가 <b>" + (gap * 1000).toFixed(0) + "m나 다르다.</b> " +
        "아이폰이 위성을 잡느라 늦게 출발한 만큼이 그대로 남고, 그 뒤로도 기기마다 계산이 미세하게 달라서 차이가 줄지 않는다. " +
        "더 곤란한 건 <b>둘 중 뭘 저장해야 맞는지 정할 근거가 없다</b>는 점이다.";
    } else {
      note.className = "note fine";
      note.innerHTML = "시작한 쪽이 계산하고 상대는 <b>받아서 표시만</b> 한다. 값이 하나뿐이라 두 화면이 어긋날 수가 없고, 저장할 때 고민할 것도 없다. " +
        "아이폰이 위성을 새로 잡을 필요도 없으니 시작하자마자 같은 숫자가 뜬다.";
    }
  }

  function stop(){ if(timer){clearInterval(timer);timer=null;} }
  document.getElementById("play").addEventListener("click", function () {
    stop(); t = 0; render();
    timer = setInterval(function () { t += 3; if (t >= DUR) { t = DUR; stop(); } render(); }, 40);
  });
  document.getElementById("reset").addEventListener("click", function () { stop(); t = -1; render(); });
  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      stop(); mode = b.dataset.m; t = -1;
      document.querySelectorAll("#seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
