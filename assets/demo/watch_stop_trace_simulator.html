<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #141a22;
    --panel2: #1c2530;
    --border: #2a3542;
    --muted: #8a95a3;
    --dim: #5d6876;
    --text: #c7d0da;
    --cyan: #3fe6c4;
    --amber: #ffb84d;
    --red: #ff6b6b;
    --red-border: #7a2a2a;
    --green: #7ff0d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 18px 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 15px; color: var(--cyan); letter-spacing: 0.5px; margin: 0 0 4px; font-weight: 700; }
  .sub { font-size: 11.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.6; }

  .modes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .modes button {
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    padding: 8px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  }
  .modes button.on { border-color: var(--cyan); color: var(--cyan); background: #122b28; }
  .modes button.on.bad { border-color: var(--red-border); color: var(--red); background: #2a1414; }

  .bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .bar button {
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    padding: 8px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .bar button.play { border-color: var(--cyan); color: var(--cyan); }
  .clock {
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700;
    color: var(--amber); margin-left: auto;
  }
  .track { flex: 1 1 100%; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--cyan); width: 0; }

  .code {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 0; margin-bottom: 12px; overflow: hidden;
  }
  .code .ln {
    display: flex; gap: 10px; padding: 1px 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.65;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim);
  }
  .code .ln b { color: #3f4a58; font-weight: 400; min-width: 16px; text-align: right; }
  .code .ln.hit { background: #12332c; color: var(--green); }
  .code .ln.hit b { color: var(--green); }
  .code .ln.miss { background: #2a1414; color: var(--red); }
  .code .ln.miss b { color: var(--red); }
  .code .cname { font-size: 10px; color: var(--dim); letter-spacing: 0.3px; padding: 0 12px 7px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .pair.keep { grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) {
    .pair { grid-template-columns: 1fr; }
    .pair.keep { grid-template-columns: 1fr 1fr; gap: 7px; }
    .dev { padding: 9px 8px; }
    .code .ln { font-size: 10px; line-height: 1.6; }
    .log .row { font-size: 10px; }
  }

  .dev { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .dev h2 { font-size: 10.5px; letter-spacing: 1px; color: var(--dim); margin: 0 0 8px; font-weight: 700; }
  .screen {
    background: #060a0e; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 8px; min-height: 78px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  }
  .big { font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700; color: var(--cyan); }
  .lbl { font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted); }
  .rec { font-size: 9.5px; letter-spacing: 1.5px; color: var(--red); font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    border: 1px solid rgba(255,184,77,0.45); color: var(--amber);
    border-radius: 999px; padding: 4px 10px; font-size: 9px; letter-spacing: 1.2px; font-weight: 700;
  }
  .alert {
    border: 1px solid var(--red-border); background: #2a1414; color: var(--red);
    border-radius: 8px; padding: 8px 10px; font-size: 10px; line-height: 1.6; margin-top: 6px; text-align: center;
  }
  .alert b { display: block; letter-spacing: 1.2px; margin-bottom: 2px; font-size: 10px; }

  .chan {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 11px; margin-bottom: 12px;
  }
  .chan .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 9.5px; color: var(--dim); letter-spacing: 0.8px; margin-bottom: 7px; }
  .chan .keys { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chan .keys span { display: inline-flex; align-items: center; gap: 4px; }
  .chan .keys i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .chan .lane {
    position: relative; height: 17px; border-radius: 9px;
    background: #0d1319; border: 1px solid var(--border); margin-bottom: 5px; overflow: hidden;
  }
  .chan .lane:last-of-type { margin-bottom: 0; }
  .chan .dot {
    position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%;
    margin-top: -3.5px; margin-left: -3.5px; background: var(--muted);
  }
  .chan .dot.health { background: var(--cyan); opacity: 0.75; }
  .chan .dot.phone { background: var(--muted); opacity: 0.5; width: 5px; height: 5px; margin-top: -2.5px; }
  .chan .dot.stop {
    width: 11px; height: 11px; margin-top: -5.5px; margin-left: -5.5px;
    background: var(--amber); box-shadow: 0 0 9px var(--amber);
  }
  .chan .note { font-size: 10px; color: var(--dim); line-height: 1.6; margin-top: 8px; }
  .chan .note.alarm { color: var(--amber); }

  .log { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .log h2 { font-size: 10.5px; letter-spacing: 1px; color: var(--dim); margin: 0 0 8px; font-weight: 700; }
  .log .rows { min-height: 104px; }
  .log .row {
    display: flex; gap: 8px; font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px; line-height: 1.7; margin-bottom: 3px;
  }
  .log .row span { flex: none; }
  .log .row u { text-decoration: none; color: var(--dim); font-size: 9.5px; }
  .log .row span { color: var(--dim); }
  .log .row em { font-style: normal; color: var(--text); }
  .log .row.key em { color: var(--cyan); font-weight: 700; }
  .log .row.bad em { color: var(--red); font-weight: 700; }
  .log .empty { font-size: 10.5px; color: var(--red); line-height: 1.8; }

  .verdict {
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 10px; padding: 11px 13px; font-size: 11.5px; line-height: 1.75; color: var(--muted);
  }
  .verdict b { color: var(--cyan); }
  .verdict.bad { border-color: var(--red-border); }
  .verdict.bad b { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <h1>워치에서 종료 버튼을 누른 뒤 10초</h1>
  <p class="sub">실제 시뮬레이터 20km 기록에서 잰 시간이다. 아래 다섯 가지를 바꿔가며 보면, 워치 쪽 흔적은 경우마다 다른데 <b>아이폰 쪽은 네 가지 실패가 전부 똑같다.</b></p>

  <div class="modes" id="modes"></div>

  <div class="bar">
    <button class="play" id="play">재생</button>
    <button id="reset">처음으로</button>
    <span class="clock" id="clock">T+0.0s</span>
    <span class="track"><i id="fill"></i></span>
  </div>

  <div class="code" id="code"></div>

  <div class="pair keep">
    <div class="dev">
      <h2>워치 화면</h2>
      <div class="screen" id="wscreen"></div>
    </div>
    <div class="dev">
      <h2>아이폰 화면</h2>
      <div class="screen" id="pscreen"></div>
    </div>
  </div>

  <div class="chan">
    <div class="cap">
      <span>워치</span>
      <span class="keys">
        <span><i style="background:#3fe6c4;opacity:.75"></i>건강 데이터</span>
        <span><i style="background:#ffb84d"></i>종료 신호</span>
        <span><i style="background:#8a95a3;opacity:.5"></i>아이폰 데이터</span>
      </span>
      <span>아이폰</span>
    </div>
    <div class="lane" id="laneUp"></div>
    <div class="lane" id="laneDown"></div>
    <div class="note" id="chanNote"></div>
  </div>

  <div class="pair">
    <div class="log">
      <h2>워치 흔적</h2>
      <div class="rows" id="wlog"></div>
    </div>
    <div class="log">
      <h2>아이폰 흔적</h2>
      <div class="rows" id="plog"></div>
    </div>
  </div>

  <div class="verdict" id="verdict"></div>
</div>

<script>
// 실제 코드다. 지금 도는 함수만 보여주고 그 안에서 도는 줄을 표시한다.
const BLOCKS = {
  stop: { name: "HealthKitService.stopWorkout()", lines: [
    "func stopWorkout() {",
    "    stopOrigin = .local",
    "    session?.stopActivity(with: Date())",
    "}"
  ]},
  handle: { name: "HealthKitService+watch.handleWatchOSStateChange()", lines: [
    "if toState == .stopped {",
    "    await finishWatchWorkout(at: date)",
    "    updateAndSendState(event)",
    "} else if toState == .running {",
    "    updateAndSendState(event)",
    "}"
  ]},
  finish: { name: "HealthKitService+watch.finishWatchWorkout()", lines: [
    "if let session, session.state != .ended {",
    "    session.end()",
    "}",
    "try await builder?.endCollection(at: date)",
    "workout = try await builder?.finishWorkout()"
  ]},
  send: { name: "WatchConnectivityService.sendStopSignal()", lines: [
    "guard WCSession.default.activationState",
    "        == .activated else { return }",
    "session.sendMessage(payload)"
  ]}
};

const NORMAL = [
  { t: 0.0, w: "watch.tapped",    d: "종료 버튼. 저장 시작" },
  { t: 0.2, w: "watch.saved",     d: "워치 저장 끝, touchdown 으로" },
  { t: 0.4, w: "stopWorkout",     d: "세션=상태2 startOrigin=remote", blk: "stop", ln: 3 },
  { t: 2.0, w: "watch.state",     d: "toState=6 처리=stopped", blk: "handle", ln: 1, key: true },
  { t: 2.1, w: "watch.finishing", d: "워크아웃 마무리 시작", blk: "finish", ln: 2 },
  { t: 2.2, w: "watch.state",     d: "toState=3 처리=other", blk: "handle", ln: 6 },
  { t: 3.0, blk: "finish", ln: 4 },
  { t: 6.5, blk: "finish", ln: 5 },
  { t: 8.0, w: "watch.finished",  d: "워크아웃 마무리 끝", blk: "handle", ln: 3 },
  { t: 8.1, w: "watch.sink",      d: "stopOrigin=local" },
  { t: 8.2, w: "send.message",    d: "바로 보냄", blk: "send", ln: 3, key: true },
  { t: 8.3, w: "watch.published", d: "stopOrigin=local 으로 발행" },
  { t: 9.0, p: "receive",         d: "통과=true", key: true },
  { t: 9.1, p: "handle",          d: "stopOrigin 을 remote 로" },
  { t: 9.2, p: "vm.sink",         d: "처리중=false 러닝중=true" },
  { t: 9.3, p: "vm.done",         d: "정리 끝, navigationPath 비움" },
  { t: 10.0, p: "pfd.gone",       d: "PFD 가 화면에서 빠짐", key: true }
];

const MODES = [
  { id: "ok", name: "정상", bad: false, steps: NORMAL, end: 11,
    verdict: "버튼부터 아이폰이 홈으로 돌아가기까지 <b>10초</b>다. 그중 <b>6초</b>가 워치의 HealthKit 저장이고, 종료 신호는 그게 끝나야 나간다. 아이폰은 9초째까지 아무것도 모른다." },

  { id: "hang", name: "마무리가 안 끝남", bad: true, end: 20,
    steps: NORMAL.filter(s => s.t <= 2.2).concat([{ t: 3.0, blk: "finish", ln: 4, miss: true }]),
    verdict: "<b>실제로 일어난 경우다.</b> 워크아웃이 멈추면 watchOS 가 심박 회복을 재려고 세션을 3분 넘게 붙잡는데, 그 사이 finishWorkout 이 저장 상태에서 안 돌아온다. 9분을 기다려도 안 풀렸다. 워치 흔적에 watch.finishing 은 있는데 watch.finished 가 없는 게 이 경우의 표시다." },

  { id: "ended", name: "ended 로 직행", bad: true, end: 20,
    steps: NORMAL.slice(0, 3).concat([
      { t: 2.0, w: "watch.state", d: "toState=3 처리=other", blk: "handle", ln: 6, miss: true }
    ]),
    verdict: "<b>stopped 를 안 거치고 ended 로 넘어간 경우.</b> 두 갈래 어디에도 안 들어가서 이벤트가 아예 안 나간다. 흔적은 한 줄 남는데 그 줄이 끝이다." },

  { id: "nosession", name: "세션이 없음", bad: true, end: 20,
    steps: NORMAL.slice(0, 2).concat([
      { t: 0.4, w: "stopWorkout", d: "세션=없음 startOrigin=remote", blk: "stop", ln: 3, miss: true }
    ]),
    verdict: "<b>세션이 이미 사라진 경우.</b> 물음표가 붙어 있어서 세션이 없으면 stopActivity 를 아예 안 부르고 그냥 지나간다. 상태 변화 콜백도 없다." },

  { id: "notactivated", name: "세션 비활성", bad: true, end: 20,
    steps: NORMAL.filter(s => s.t <= 8.1).concat([
      { t: 8.2, w: "send.notActivated", d: "활성화 안 됨, 안 보냄", blk: "send", ln: 2, miss: true },
      { t: 8.3, w: "watch.published", d: "stopOrigin=local 으로 발행" }
    ]),
    verdict: "<b>WCSession 이 아직 활성화되지 않은 경우.</b> 워치는 끝까지 다 갔는데 마지막 한 줄에서 돌아선다. 여기만 워치 흔적이 길다." }
];

// 실패하는 경우에는 15초에 아이폰이 끊김을 알아챈다. 그 줄도 흔적에 남는다.
MODES.filter(m => m.bad).forEach(m => {
  m.steps = m.steps.concat([
    { t: 15, p: "watch.silent", d: "15초째 워치 데이터 없음", miss: true }
  ]);
});

/// 종료 버튼을 누르기 전부터 보여준다. 흐르던 게 끊기는 걸 봐야 뜻이 산다.
const T0 = -12;

/// 오가는 신호. 건강 데이터 5초 간격은 실기기 1398개에서 잰 값이다.
function packets(m) {
  const out = [];
  // 건너가는 데 1초를 쓴다. 실제 종료 신호가 18:26:34 에 나가 18:26:35 에 닿았다.
  for (const at of [-11, -6, -1]) out.push({ dir: "up", s: at, a: at + 1, kind: "health" });

  const sent = m.steps.find(x => x.w === "send.message" && x.t > 0);
  if (sent) out.push({ dir: "up", s: sent.t, a: sent.t + 0.8, kind: "stop" });

  const gone = m.steps.find(x => x.p === "pfd.gone");
  const until = gone ? gone.t : 20;
  for (let x = -11.5; x < until; x += 1.6) out.push({ dir: "down", s: x, a: x + 1, kind: "phone" });
  return out;
}

function drawChannel() {
  const up = document.getElementById("laneUp"), down = document.getElementById("laneDown");
  up.querySelectorAll(".dot").forEach(d => d.remove());
  down.querySelectorAll(".dot").forEach(d => d.remove());

  packets(mode).forEach(pk => {
    if (t < pk.s || t > pk.a) return;
    const lane = pk.dir === "up" ? up : down;
    const prog = (t - pk.s) / (pk.a - pk.s);
    const d = document.createElement("span");
    d.className = "dot " + pk.kind;
    d.style.left = (pk.dir === "up" ? 4 + prog * 92 : 96 - prog * 92) + "%";
    lane.appendChild(d);
  });

  const n = document.getElementById("chanNote");
  if (t < 0) {
    n.className = "note";
    n.textContent = "러닝 중. 워치가 5초마다 건강 데이터를 보낸다. 하나쯤 놓쳐도 다음 게 온다.";
  } else if (t >= 15 && mode.bad) {
    n.className = "note alarm";
    n.textContent = "15초. 아이폰이 끊김을 알아채고 끝낼지 묻는다. 신호가 안 와도 러닝이 영영 안 끝나지는 않는다.";
  } else if (t >= 10 && mode.bad) {
    n.className = "note alarm";
    n.textContent = "10초. 아이폰이 기다리는 중이라고만 표시한다. 아직 끝났다고 말하지 않는다.";
  } else if (mode.bad) {
    n.className = "note";
    n.textContent = "종료를 눌러서 건강 데이터가 끊겼다. 종료 신호는 끝내 올라오지 않는다.";
  } else {
    n.className = "note";
    n.textContent = "건강 데이터는 끊겼고, 러닝당 한 번뿐인 종료 신호만 올라간다.";
  }
}

let mode = MODES[0], t = T0, timer = null;
const $ = id => document.getElementById(id);

function drawModes() {
  $("modes").innerHTML = "";
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.textContent = m.name;
    if (m.id === mode.id) b.className = "on" + (m.bad ? " bad" : "");
    b.onclick = () => { mode = m; reset(); };
    $("modes").appendChild(b);
  });
}

function drawCode() {
  let cur = null;
  mode.steps.forEach(s => { if (s.t <= t && s.blk) cur = s; });
  if (!cur) cur = { blk: "stop", ln: 0 };
  const b = BLOCKS[cur.blk];
  const rows = b.lines.map((c, i) => {
    const n = i + 1;
    const cls = n === cur.ln ? (cur.miss ? "ln miss" : "ln hit") : "ln";
    return `<div class="${cls}"><b>${n}</b>${c.replace(/</g, "&lt;")}</div>`;
  }).join("");
  $("code").innerHTML = `<div class="cname">${b.name}</div>${rows}`;
}

function drawLog(which, el) {
  const rows = mode.steps.filter(s => s.t <= t && s[which]);
  if (!rows.length) {
    el.innerHTML = `<div class="empty">${t >= 1 ? "(아무것도 안 들어옴)" : "<span style=\"color:var(--dim)\">(종료를 누르기 전)</span>"}</div>`;
    return;
  }
  el.innerHTML = rows.map(s => {
    const cls = s.miss ? "row bad" : s.key ? "row key" : "row";
    const det = s.d ? ` <u>${s.d}</u>` : "";
    return `<div class="${cls}"><span>+${s.t.toFixed(1)}</span><div><em>${s[which]}</em>${det}</div></div>`;
  }).join("");
}

function drawScreens() {
  const done = mode.steps.some(s => s.p === "pfd.gone" && s.t <= t);
  $("wscreen").innerHTML = t >= 0.2
    ? `<div class="lbl">TOUCHDOWN</div><div class="big">20.09</div><div class="lbl">요약 보기</div>`
    : `<div class="rec">● REC</div><div class="big">20.09</div><div class="lbl">KM</div>`;

  if (done) {
    $("pscreen").innerHTML = `<div class="lbl">HANGAR</div><div class="big">홈</div><div class="lbl">러닝 끝</div>`;
    return;
  }
  const mins = Math.floor((5081 + t) / 60), secs = Math.floor((5081 + t) % 60);
  let html = `<div class="rec">● REC</div><div class="big">20.09</div>`
    + `<div class="lbl">${mins}분 ${String(secs).padStart(2, "0")}초 · 세는 중</div>`;
  if (t >= 10) html += `<div class="pill">AWAITING WATCH</div>`;
  if (t >= 15) html += `<div class="alert"><b>LOST CONTACT</b>워치에서 끝난 것 같습니다.<br>이 러닝을 종료할까요?</div>`;
  $("pscreen").innerHTML = html;
}

function draw() {
  $("clock").textContent = (t < 0 ? "T" : "T+") + t.toFixed(1) + "s";
  $("fill").style.width = Math.min(100, ((t - T0) / (mode.end - T0)) * 100) + "%";
  drawCode(); drawChannel(); drawLog("w", $("wlog")); drawLog("p", $("plog")); drawScreens();
  $("verdict").className = "verdict" + (mode.bad ? " bad" : "");
  $("verdict").innerHTML = mode.verdict;
}

function reset() {
  clearInterval(timer); timer = null;
  t = T0; $("play").textContent = "재생";
  drawModes(); draw();
}

$("play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "재생"; return; }
  if (t >= mode.end) t = T0;
  $("play").textContent = "멈춤";
  timer = setInterval(() => {
    t = Math.round((t + 0.1) * 10) / 10;
    if (t >= mode.end) { t = mode.end; clearInterval(timer); timer = null; $("play").textContent = "재생"; }
    draw();
  }, 60);
};
$("reset").onclick = reset;
reset();
</script>
</body>
</html>
