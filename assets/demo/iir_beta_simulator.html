<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIR Beta Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --raw:#9aa1ab; --f1:#b45309; --f2:#2563eb; --grid:#eceff2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --raw:#52525b; --f1:#fbbf24; --f2:#60a5fa; --grid:#1c1c20;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; }
  input[type=range]{ flex:1 1 200px; min-width:160px; accent-color:var(--ok); height:26px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; font-weight:500; padding:8px 12px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11px; padding:6px 10px; border-radius:6px; }
  .chip.on { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }

  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:16px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }

  .track { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:10px 10px 4px; overflow-x:auto; }
  .track svg { display:block; width:100%; min-width:440px; height:auto; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:11px; color:var(--dim); font-family:'Fira Code',monospace; }
  .legend i { display:inline-block; width:15px; height:2.5px; border-radius:2px; vertical-align:middle; margin-right:5px; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>새로 들어온 값을 얼마나 믿을 것인가</h1>
<p class="lead">계수 β는 <b>방금 들어온 GPS 속도를 얼마나 반영할지</b>를 정한다. 크게 잡으면 빨리 따라가는 대신 GPS가 흔들리는 대로 같이 흔들리고, 작게 잡으면 잔잔한 대신 느리게 따라온다. 20초 지점에서 실제로 속도를 올린 상황이다.</p>

<div class="bar">
  <span>계수 β</span>
  <input type="range" id="b" min="3" max="60" value="15">
  <span id="b-label" style="font-size:12.5px;color:var(--ink);text-transform:none;letter-spacing:0;font-family:'Fira Code',monospace;font-weight:600">0.15</span>
  <div class="chips">
    <button type="button" class="chip" data-b="15">0.15</button>
    <button type="button" class="chip" data-b="18">0.18</button>
    <button type="button" class="chip" data-b="50">0.50</button>
  </div>
</div>
<div class="bar">
  <span>첫 샘플 보정</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-s="0" aria-pressed="true">없음 (0에서 시작)</button>
    <button type="button" data-s="1" aria-pressed="false">첫 값으로 채우고 시작</button>
  </div>
</div>

<div class="row">
  <div class="cell"><div class="k">90%까지 따라잡는 시간</div><div class="v" id="v-settle">--</div></div>
  <div class="cell"><div class="k">흔들림 폭 (원본 대비)</div><div class="v" id="v-noise">--</div></div>
  <div class="cell"><div class="k">시작 1초 페이스</div><div class="v" id="v-first">--</div></div>
</div>

<div class="track">
  <div id="plot"></div>
  <div class="legend">
    <span><i style="background:var(--raw)"></i>GPS가 준 속도</span>
    <span><i style="background:var(--f1)"></i>1차 필터</span>
    <span><i style="background:var(--f2)"></i>2차 필터 (실제로 쓰는 값)</span>
  </div>
</div>
<div class="note" id="note"></div>

<script>
(function () {
  "use strict";
  var N = 140, STEP_AT = 20, V0 = 2.0, V1 = 2.9;

  var RAW = (function () {
    var out = [], seed = 20260611;
    for (var k = 0; k < N; k++) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      var noise = (seed / 2147483648 - 0.5) * 0.62;   // GPS 순간 속도의 흔들림
      out.push(Math.max(0.1, (k < STEP_AT ? V0 : V1) + noise));
    }
    return out;
  })();

  var beta = 0.15, seedInit = false;

  function run() {
    var f1 = 0, f2 = 0, init = false, s1 = [], s2 = [];
    for (var k = 0; k < N; k++) {
      var v = RAW[k];
      if (seedInit && !init) { f1 = v; f2 = v; init = true; }
      f1 = (1 - beta) * f1 + beta * v;
      f2 = (1 - beta) * f2 + beta * f1;
      s1.push(f1); s2.push(f2);
    }
    return { s1: s1, s2: s2 };
  }

  function fmtPace(v) {
    if (!(v > 0)) return "--:--";
    var p = 1000 / (v * 60), t = Math.round(p * 60);
    if (t > 3599) return "59'59\"+";
    return (t / 60 | 0) + "'" + String(t % 60).padStart(2, "0") + '"';
  }

  function render() {
    beta = +document.getElementById("b").value / 100;
    document.getElementById("b-label").textContent = beta.toFixed(2);
    document.querySelectorAll(".chip").forEach(function (c) {
      c.classList.toggle("on", Math.abs(+c.dataset.b / 100 - beta) < 1e-9);
    });

    var r = run();

    // 반응 속도는 노이즈 없는 계단 응답으로 잰다 (필터 자체의 성질)
    var settle = null, a = 0, b2 = 0;
    for (var k = 1; k <= 400; k++) {
      a = (1 - beta) * a + beta * 1;
      b2 = (1 - beta) * b2 + beta * a;
      if (b2 >= 0.9) { settle = k; break; }
    }

    // 흔들림 폭: 충분히 안정된 뒤 구간의 최고-최저
    function span(arr) {
      var t = arr.slice(N - 20);
      return Math.max.apply(null, t) - Math.min.apply(null, t);
    }
    var rawSpan = span(RAW), smSpan = span(r.s2);

    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-settle", settle + "초", settle > 30 ? "alarm" : (settle <= 22 ? "good" : ""));
    set("v-noise", (smSpan / rawSpan * 100).toFixed(0) + "% 로 줄어듦", smSpan / rawSpan < 0.35 ? "good" : "alarm");
    set("v-first", fmtPace(r.s2[0]), seedInit ? "good" : "alarm");

    var W = 700, H = 200, PL = 38, PR = 10, PT = 12, PB = 24;
    var lo = 0, hi = 3.6;
    var X = function (k) { return PL + k / (N - 1) * (W - PL - PR); };
    var Y = function (v) { return PT + (hi - v) / (hi - lo) * (H - PT - PB); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="필터 비교 그래프">';
    for (var g = 0; g <= 3; g++) {
      s += '<line x1="' + PL + '" y1="' + Y(g).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(g).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
      s += '<text x="' + (PL - 6) + '" y="' + (Y(g) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">' + g + '</text>';
    }
    s += '<line x1="' + X(STEP_AT).toFixed(1) + '" y1="' + PT + '" x2="' + X(STEP_AT).toFixed(1) + '" y2="' + (H - PB) + '" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>';
    s += '<text x="' + (X(STEP_AT) + 5).toFixed(1) + '" y="' + (PT + 11) + '" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">여기서 속도를 올림</text>';
    if (settle !== null) {
      s += '<line x1="' + X(STEP_AT + settle).toFixed(1) + '" y1="' + PT + '" x2="' + X(STEP_AT + settle).toFixed(1) + '" y2="' + (H - PB) + '" stroke="var(--f2)" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>';
    }
    function line(arr, color, w, dash) {
      return '<polyline points="' + arr.map(function (v, k) { return X(k).toFixed(1) + ',' + Y(Math.min(v, hi)).toFixed(1); }).join(' ') +
        '" fill="none" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linejoin="round"/>';
    }
    s += line(RAW, "var(--raw)", 1.3, "3 2.5");
    s += line(r.s1, "var(--f1)", 1.6);
    s += line(r.s2, "var(--f2)", 2.4);
    s += '<text x="' + PL + '" y="' + (H - 7) + '" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">0초</text>';
    s += '<text x="' + (W - PR) + '" y="' + (H - 7) + '" text-anchor="end" font-size="9" font-family="Fira Code,monospace" fill="var(--faint)">' + (N - 1) + '초</text>';
    s += '</svg>';
    document.getElementById("plot").innerHTML = s;

    var note = document.getElementById("note");
    if (!seedInit) {
      note.className = "note alarm";
      note.innerHTML = "보정을 안 하면 필터가 <b>0에서 출발</b>한다. 이미 뛰고 있는데 계산된 속도는 0에 가깝고, 페이스는 그걸 뒤집은 값이라 " +
        "시작 1초에 <b>" + fmtPace(r.s2[0]) + "</b>가 찍힌다. 그래서 첫 샘플이 들어오는 순간 두 필터를 그 값으로 채우고 시작한다.";
    } else if (beta >= 0.4) {
      note.className = "note alarm";
      note.innerHTML = "β를 크게 잡으니 <b>" + settle + "초</b> 만에 따라잡는다. 대신 GPS의 흔들림이 거의 그대로 넘어와서 " +
        "화면의 페이스가 계속 출렁인다. 보정하기 전 상태가 이랬다.";
    } else if (beta <= 0.08) {
      note.className = "note alarm";
      note.innerHTML = "흔들림은 확실히 잡히는데 따라잡는 데 <b>" + settle + "초나 걸린다.</b> " +
        "실제로 속도를 올렸는데 화면은 한참 뒤에야 반응한다는 뜻이라, 경고가 늦게 풀린다.";
    } else {
      note.className = "note fine";
      note.innerHTML = "β = " + beta.toFixed(2) + "에서 흔들림은 원본의 <b>" + (smSpan / rawSpan * 100).toFixed(0) + "%</b>로 줄고, " +
        "속도를 올린 뒤 <b>" + settle + "초</b>면 따라잡는다. 사람이 뛰는 속도는 자동차처럼 급변하지 않으니 반응을 조금 양보하는 쪽이 맞다고 봤다.";
    }
  }

  document.getElementById("b").addEventListener("input", render);
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { document.getElementById("b").value = c.dataset.b; render(); });
  });
  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      seedInit = b.dataset.s === "1";
      document.querySelectorAll("#seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
