<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthKit Anchor Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --mark:#2563eb; --mark-bg:#e8effc; --dup:#b45309; --dup-bg:#fdf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --mark:#60a5fa; --mark-bg:#14203a; --dup:#fbbf24; --dup-bg:#2e2410;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:66ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; margin-right:2px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; font-weight:500; padding:9px 13px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:9px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }
  .sp { flex:1 1 6px; }

  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:16px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }
  @media (max-width:520px){ .row{grid-template-columns:repeat(2,1fr);} }

  .store { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 12px; }
  .store h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 9px; font-weight:500; }
  .dots { display:flex; flex-wrap:wrap; gap:4px; position:relative; }
  .dot { width:15px; height:15px; border-radius:4px; background:var(--line); position:relative; }
  .dot.got { background:var(--mark); }
  .dot.dup { background:var(--dup); }
  .dot.fresh { outline:2px solid var(--ok); outline-offset:1px; }
  .anchor { display:flex; align-items:center; gap:7px; margin-top:10px;
    font-family:'Fira Code',monospace; font-size:11px; color:var(--dim); }
  .anchor b { color:var(--ink); }

  .legend { display:flex; gap:13px; flex-wrap:wrap; margin-top:9px; font-size:10.5px; color:var(--dim); font-family:'Fira Code',monospace; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>같은 심박을 몇 번이나 다시 받아올 것인가</h1>
<p class="lead">건강 저장소에 심박 샘플이 계속 쌓인다. 앱은 주기적으로 "새로 들어온 거 줘"라고 물어보는데, <code>anchor</code>는 <b>어디까지 가져갔는지 적어둔 책갈피</b>다. 이걸 안 들고 가면 매번 처음부터 다 받아온다.</p>

<div class="bar">
  <span>책갈피</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-a="0" aria-pressed="true">anchor: nil (안 들고 감)</button>
    <button type="button" data-a="1" aria-pressed="false">직전 anchor 들고 감</button>
  </div>
  <span class="sp"></span>
  <button type="button" class="btn" id="reset">처음으로</button>
  <button type="button" class="btn primary" id="ask">한 번 물어보기</button>
</div>

<div class="row">
  <div class="cell"><div class="k">물어본 횟수</div><div class="v" id="v-q">--</div></div>
  <div class="cell"><div class="k">저장소에 쌓인 샘플</div><div class="v" id="v-total">--</div></div>
  <div class="cell"><div class="k">이번에 받은 샘플</div><div class="v" id="v-got">--</div></div>
  <div class="cell"><div class="k">지금까지 받은 총량</div><div class="v" id="v-sum">--</div></div>
</div>

<div class="store">
  <h2>건강 저장소의 심박 샘플</h2>
  <div class="dots" id="dots"></div>
  <div class="anchor" id="anchor-line"></div>
  <div class="legend">
    <span><i style="background:var(--mark)"></i>이미 받아둔 것</span>
    <span><i style="background:var(--mark);outline:2px solid var(--ok);outline-offset:1px"></i>이번에 받은 것</span>
    <span><i style="background:var(--dup)"></i>이미 받았는데 또 받은 것</span>
  </div>
</div>
<div class="note" id="note">"한 번 물어보기"를 눌러보자. 누를 때마다 그 사이에 심박이 몇 개 더 쌓인다.</div>

<script>
(function () {
  "use strict";
  var GROWTH = [12, 5, 4, 6, 3, 5, 4];   // 물어보는 사이사이에 새로 쌓이는 샘플 수

  var useAnchor = false, q = 0;

  function state() {
    var total = 0, anchor = 0, sum = 0, lastGot = 0, lastDup = 0, lastPrev = 0;
    for (var k = 0; k < q; k++) {
      var before = total; lastPrev = before;
      total += GROWTH[Math.min(k, GROWTH.length - 1)];
      var from = useAnchor ? anchor : 0;   // 책갈피가 없으면 늘 처음부터 다시 받는다
      lastGot = total - from;
      lastDup = useAnchor ? 0 : before;    // 이미 받았던 만큼이 그대로 중복이 된다
      sum += lastGot;
      anchor = total;
    }
    return { total: total, sum: sum, got: lastGot, dup: lastDup, anchor: anchor, prev: lastPrev };
  }

  function render() {
    var st = state();
    var set = function (id, v, cls) {
      var e = document.getElementById(id); e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };
    set("v-q", q + "회");
    set("v-total", st.total + "개");
    set("v-got", q ? st.got + "개" + (st.dup ? " (중복 " + st.dup + ")" : "") : "--", st.dup ? "alarm" : (q ? "good" : ""));
    set("v-sum", q ? st.sum + "개" : "--", (q && !useAnchor && st.sum > st.total) ? "alarm" : "");

    var dots = "";
    for (var k = 0; k < st.total; k++) {
      var cls = "dot";
      if (q === 0) cls += "";
      else if (k < st.prev) cls += (useAnchor ? " got" : " dup");
      else cls += " got fresh";
      dots += '<div class="' + cls + '"></div>';
    }
    document.getElementById("dots").innerHTML = dots || '<span style="font-family:Fira Code,monospace;font-size:11px;color:var(--faint)">아직 없음</span>';

    document.getElementById("anchor-line").innerHTML = q === 0
      ? "책갈피: <b>없음</b>"
      : (useAnchor
          ? "다음에 들고 갈 책갈피: <b>" + st.anchor + "번째까지 받음</b>"
          : "책갈피를 안 들고 가니 다음에도 <b>1번째부터</b> 다시 받는다");

    var note = document.getElementById("note");
    if (q === 0) { note.className = "note"; note.textContent = '"한 번 물어보기"를 눌러보자. 누를 때마다 그 사이에 심박이 몇 개 더 쌓인다.'; return; }
    if (useAnchor) {
      note.className = "note fine";
      note.innerHTML = "책갈피 덕분에 <b>새로 쌓인 " + st.got + "개만</b> 받아왔다. " + q + "번 물어보는 동안 받은 총량이 " +
        st.sum + "개로, 저장소에 있는 " + st.total + "개와 정확히 같다. 한 샘플을 두 번 받는 일이 없다.";
    } else {
      note.className = "note alarm";
      note.innerHTML = "이번에 " + st.got + "개를 받았는데 그중 <b>" + st.dup + "개는 지난번에 이미 받았던 것</b>이다. " +
        q + "번 물어보는 동안 총 " + st.sum + "개를 받았고, 저장소에는 " + st.total + "개뿐이다. " +
        "<b>" + (st.sum - st.total) + "개는 헛수고</b>였던 셈이다. 7일치를 이렇게 계속 물어보면 이 낭비가 눈덩이처럼 커진다.";
    }
  }

  document.getElementById("ask").addEventListener("click", function () { if (q < 7) q++; render(); });
  document.getElementById("reset").addEventListener("click", function () { q = 0; render(); });
  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      useAnchor = b.dataset.a === "1"; q = 0;
      document.querySelectorAll("#seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
