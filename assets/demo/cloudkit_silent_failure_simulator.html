<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudKit Silent Failure Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --warn:#9a6b0a; --warn-bg:#f9eeda;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --warn:#f3bc55; --warn-bg:#33260b;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:70ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:9px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; flex:0 0 52px; align-self:center; }
  .seg { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11px; font-weight:500; padding:8px 11px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11.5px; padding:8px 13px; border-radius:7px; }
  .btn.primary { background:var(--ok); border-color:var(--ok); color:var(--bg); font-weight:600; }

  .phone { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:13px 14px; margin-top:13px; }
  .phone .cap { font-family:'Fira Code',monospace; font-size:9.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--faint); margin-bottom:9px; }
  .toast { font-size:14px; font-weight:600; padding:11px 13px; border-radius:9px;
    background:var(--bg); border:1px solid var(--line); line-height:1.45; }
  .toast.ok { border-color:var(--ok); color:var(--ok); }
  .toast.zero { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .sub { font-size:11.5px; color:var(--dim); margin-top:7px; line-height:1.55; }

  .row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:12px; }
  @media (max-width:520px){ .row{grid-template-columns:1fr;} }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:13px; font-weight:600; margin-top:4px; line-height:1.35; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); } .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }
  .cell.dim .v { color:var(--faint); }

  .note { margin-top:13px; font-size:12.5px; line-height:1.68; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>에러를 안 던지는 실패</h1>
<p class="lead">백업 버튼을 눌렀을 때 무슨 일이 일어나는지 본다. 저장 정책에 따라 두 번째 백업이 <b>실패하는데도 에러가 안 난다.</b> 화면에는 0개 백업했다는 문구만 뜬다.</p>

<div class="bar">
  <span>저장 정책</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-v="unchanged" aria-pressed="true">기본값 (서버와 비교)</button>
    <button type="button" data-v="changed" aria-pressed="false">changedKeys (덮어쓰기)</button>
  </div>
</div>
<div class="bar">
  <span>동작</span>
  <button type="button" class="btn primary" id="run">백업 버튼 누르기</button>
  <button type="button" class="btn" id="reset">처음으로</button>
</div>

<div class="row">
  <div class="cell"><div class="k">누른 횟수</div><div class="v" id="v1">0</div></div>
  <div class="cell"><div class="k">서버에 올라간 기록</div><div class="v" id="v2">0건</div></div>
  <div class="cell"><div class="k">던져진 에러</div><div class="v" id="v3">없음</div></div>
</div>

<div class="phone">
  <div class="cap">앱 화면</div>
  <div class="toast" id="toast">아직 누르지 않았다</div>
  <div class="sub" id="sub"></div>
</div>
<div class="note" id="note"></div>

<script>
(function () {
  "use strict";
  var policy = "unchanged", taps = 0, saved = 0;
  var TOTAL = 12;

  function render(justRan) {
    var e1 = document.getElementById("v1"), e2 = document.getElementById("v2"), e3 = document.getElementById("v3");
    e1.textContent = taps + "회";
    e1.parentElement.className = "cell" + (taps ? "" : " dim");
    e2.textContent = saved + "건";
    e2.parentElement.className = "cell" + (saved ? " good" : (taps ? " alarm" : " dim"));
    e3.textContent = "없음";
    e3.parentElement.className = "cell" + (taps && policy === "unchanged" && taps > 1 ? " alarm" : " dim");

    var toast = document.getElementById("toast"), sub = document.getElementById("sub");
    if (!taps) {
      toast.className = "toast"; toast.textContent = "아직 누르지 않았다"; sub.textContent = "";
    } else if (policy === "unchanged" && taps > 1) {
      toast.className = "toast zero"; toast.textContent = "0개 백업했습니다";
      sub.textContent = "예외는 안 났다. 레코드별 결과 안에 실패가 담겨 있을 뿐이다.";
    } else {
      toast.className = "toast ok"; toast.textContent = TOTAL + "개 백업했습니다";
      sub.textContent = "정상적으로 올라갔다.";
    }

    var n = document.getElementById("note");
    if (!taps) {
      n.className = "note";
      n.innerHTML = "백업 버튼을 눌러보자. <b>두 번 눌러야</b> 차이가 보인다.";
      return;
    }
    if (policy === "unchanged") {
      if (taps === 1) {
        n.className = "note";
        n.innerHTML = "첫 백업은 성공한다. 서버에 같은 레코드가 없어서 비교할 대상도 없기 때문이다. <b>한 번만 눌러보면 문제를 못 찾는다.</b> 이어서 한 번 더 눌러보자.";
      } else {
        n.className = "note alarm";
        n.innerHTML = "기본 저장 정책은 <b>서버에 있는 레코드와 버전을 비교</b>한다. 그런데 앱이 새로 만든 로컬 레코드에는 그 비교에 쓸 변경 태그가 없어서 <b>충돌로 판단하고 실패</b>한다. " +
          "여기서 핵심은 <b>이 실패가 예외를 던지지 않는다는 것</b>이다. 레코드별 결과 안에만 담겨 있어서 <code>try</code>로도 안 잡히고, 앱은 성공한 개수만 세어 0을 보여준다. " +
          "<b>화면에 0개라고 뜨는데 왜 0인지는 화면 어디에도 없다.</b> 이게 이 버그를 오래 못 찾은 이유다.";
      }
    } else {
      n.className = "note fine";
      n.innerHTML = "<code>savePolicy: .changedKeys</code>로 바꾸면 서버 버전과 비교하지 않고 <b>로컬 상태로 무조건 덮어쓴다.</b> 몇 번을 눌러도 같은 결과가 나온다. " +
        "개인 백업이라 <b>다른 기기가 같은 레코드를 동시에 고칠 일이 없어서</b> 이 선택이 안전하다. 여러 사람이 함께 쓰는 데이터였다면 비교하는 쪽이 맞다.";
    }
  }

  document.getElementById("run").addEventListener("click", function () {
    taps++;
    saved = (policy === "unchanged" && taps > 1) ? 0 : TOTAL;
    render(true);
  });
  document.getElementById("reset").addEventListener("click", function () {
    taps = 0; saved = 0; render();
  });
  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      policy = b.dataset.v; taps = 0; saved = 0;
      document.querySelectorAll("#seg button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
