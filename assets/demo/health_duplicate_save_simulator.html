<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Duplicate Save Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --warn:#9a6b0a; --warn-bg:#f9eeda;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --warn:#f3bc55; --warn-bg:#33260b;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:68ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:9px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; flex:0 0 62px; line-height:1.35; align-self:center; }
  .seg { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11px; font-weight:500; padding:8px 11px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .seg button.warn[aria-pressed="true"] { background:var(--warn); }

  .row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin:13px 0 12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:12.5px; font-weight:600; margin-top:4px; line-height:1.35; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); }
  .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }
  .cell.off .v { color:var(--faint); }
  @media (max-width:560px){ .row{grid-template-columns:repeat(2,minmax(0,1fr));} }

  .stage { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 12px; }
  .stage h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 9px; font-weight:500; }
  .recs { display:flex; flex-direction:column; gap:6px; min-height:74px; }
  .rec { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px 10px; border:1px solid var(--line); border-radius:7px;
    background:var(--bg); padding:7px 10px; font-family:'Fira Code',monospace; font-size:11px; color:var(--dim); }
  .rec b { color:var(--ink); font-size:11.5px; font-weight:600; }
  .rec .who { margin-left:auto; font-size:10px; color:var(--faint); }
  .rec.dup { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .rec.dup b, .rec.dup .who { color:var(--bad); }
  .none { font-family:'Fira Code',monospace; font-size:11px; color:var(--faint); padding:4px 2px; }
  .none.bad { color:var(--bad); }

  .note { margin-top:12px; font-size:12.5px; line-height:1.65; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note.alarm { border-left-color:var(--bad); }
  .note.fine { border-left-color:var(--ok); }
  .note.warn { border-left-color:var(--warn); }
</style>
</head>
<body>

<h1>저장 주체가 둘이면 기록도 둘이 된다</h1>
<p class="lead">러닝을 한 번 하고 정상적으로 끝냈을 때, 애플 건강 앱의 운동 목록에 무엇이 남는지를 본다. 아이폰은 <code>finishWorkout()</code>을 부르지 않지만, 세션이 끝나면 <b>시스템이 수집기를 대신 마감해 저장</b>한다. 워치는 자기가 직접 저장한다.<br>아래에서 <b>버린다</b>는 <code>discardWorkout()</code>, 즉 아이폰이 모은 데이터를 <b>저장하지 않고 닫는 것</b>을 말한다.</p>

<div class="bar">
  <span>구성</span>
  <div class="seg" id="seg-setup">
    <button type="button" data-v="withWatch" aria-pressed="true">워치 함께</button>
    <button type="button" data-v="phoneOnly" aria-pressed="false">워치 꺼둠</button>
  </div>
</div>
<div class="bar">
  <span>아이폰<br>수집기</span>
  <div class="seg" id="seg-fix">
    <button type="button" class="danger" data-v="none" aria-pressed="true">그대로 둔다</button>
    <button type="button" class="warn" data-v="always" aria-pressed="false">조건 없이 버린다</button>
    <button type="button" data-v="mirrored" aria-pressed="false">미러링일 때만 버린다</button>
  </div>
</div>

<div class="row">
  <div class="cell"><div class="k">아이폰 수집기</div><div class="v" id="v-iphone">--</div></div>
  <div class="cell"><div class="k">워치 수집기</div><div class="v" id="v-watch">--</div></div>
  <div class="cell"><div class="k">건강 앱 기록</div><div class="v" id="v-health">--</div></div>
  <div class="cell"><div class="k">앱 Logbook</div><div class="v" id="v-log">--</div></div>
</div>

<div class="stage">
  <h2>건강 앱 &gt; 운동 목록</h2>
  <div class="recs" id="recs"></div>
</div>
<div class="note" id="note"></div>

<script>
(function () {
  "use strict";
  var setup = "withWatch", fix = "none";

  function render() {
    var mirrored = setup === "withWatch";

    // 아이폰: 미러링이면 startWatchApp 성공으로 runningMode == .mirrored
    var iphoneDiscards = (fix === "always") || (fix === "mirrored" && mirrored);
    var iphoneSaves = !iphoneDiscards;
    var watchSaves = mirrored;

    var recs = [];
    if (iphoneSaves) recs.push({ dev: "iPhone", by: "시스템이 마감" });
    if (watchSaves) recs.push({ dev: "Apple Watch", by: "finishWorkout()" });

    var set = function (id, v, cls) {
      var e = document.getElementById(id);
      e.textContent = v;
      e.parentElement.className = "cell" + (cls ? " " + cls : "");
    };

    set("v-iphone", iphoneDiscards ? "버린다" : "시스템이 마감",
        iphoneDiscards ? "good" : (recs.length > 1 ? "alarm" : ""));
    set("v-watch", watchSaves ? "finishWorkout()" : "실행 안 함",
        watchSaves ? "" : "off");
    set("v-health", recs.length + "건",
        recs.length === 1 ? "good" : "alarm");
    set("v-log", "1건", "good");

    var host = document.getElementById("recs");
    if (!recs.length) {
      host.innerHTML = '<div class="none bad">남는 기록이 없다</div>';
    } else {
      host.innerHTML = recs.map(function (r) {
        var dup = recs.length > 1 ? " dup" : "";
        return '<div class="rec' + dup + '"><b>Running</b><span>20:30:36 시작</span>' +
               '<span>Source RunWay</span><span class="who">Device ' + r.dev + ' · ' + r.by + '</span></div>';
      }).join("");
    }

    var note = document.getElementById("note");
    if (recs.length === 2) {
      note.className = "note alarm";
      note.innerHTML = "한 번 뛰었는데 <b>기록이 두 건</b>이다. 시작 시각은 초 단위까지 같고 종료만 몇 초 차이가 난다. " +
        "출처는 둘 다 앱이고 기기만 다르다. 주간 합계에는 두 배로 반영되지 않아서, <b>운동 목록을 직접 열어보기 전까지는 드러나지 않는다.</b>";
    } else if (recs.length === 0) {
      note.className = "note warn";
      note.innerHTML = "조건을 안 걸고 버리면 <b>워치가 없을 때 저장할 주체가 사라진다.</b> 아이폰이 유일한 저장 주체였기 때문이다. " +
        "중복을 없애는 것과 기록을 없애는 건 다른 얘기다. <b>이래서 조건을 붙였다.</b>";
    } else {
      note.className = "note fine";
      note.innerHTML = "기록이 <b>한 건</b>이다. 저장한 쪽은 " + (watchSaves ? "워치다" : "아이폰이다") + ". " +
        (fix === "mirrored"
          ? "미러링일 때만 아이폰 것을 버리기 때문에, <b>워치가 있으면 워치가, 없으면 아이폰이</b> 저장 주체가 된다."
          : "아이폰이 마감을 안 해도 시스템이 대신 저장하기 때문에 기록 자체는 남는다.");
    }
    note.innerHTML += " 앱 Logbook은 어느 경우든 1건이다. 건강 앱과 무관하게 따로 저장하기 때문이다.";
  }

  function wire(id, set) {
    document.querySelectorAll("#" + id + " button").forEach(function (b) {
      b.addEventListener("click", function () {
        set(b.dataset.v);
        document.querySelectorAll("#" + id + " button").forEach(function (x) {
          x.setAttribute("aria-pressed", String(x === b));
        });
        render();
      });
    });
  }
  wire("seg-setup", function (v) { setup = v; });
  wire("seg-fix", function (v) { fix = v; });
  render();
})();
</script>
</body>
</html>
