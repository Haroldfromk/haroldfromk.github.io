<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Session Timing Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
    --faint:#9aa1ab; --bad:#d0392b; --bad-bg:#fbeae8; --ok:#0d9276; --ok-bg:#e2f4ef;
    --warn:#9a6b0a; --warn-bg:#f9eeda;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#09090b; --panel:#141417; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --faint:#71717a; --bad:#f87171; --bad-bg:#331416; --ok:#34d399; --ok-bg:#0d2b23;
      --warn:#f3bc55; --warn-bg:#33260b;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,'Apple SD Gothic Neo',sans-serif;
    user-select:none; -webkit-user-select:none; }
  h1 { font-size:15px; font-weight:700; margin:0 0 5px; }
  .lead { font-size:12.5px; line-height:1.6; color:var(--dim); margin:0 0 14px; max-width:70ch; }
  .lead code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .bar > span { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--faint); text-transform:uppercase; flex:0 0 46px; align-self:center; }
  .seg { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:none; background:var(--bg); color:var(--dim); cursor:pointer;
    font-family:'Fira Code',monospace; font-size:11px; font-weight:500; padding:8px 11px;
    border-right:1px solid var(--line); transition:background .13s,color .13s; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed="true"] { background:var(--ok); color:var(--bg); font-weight:600; }
  .seg button.danger[aria-pressed="true"] { background:var(--bad); }
  .seg button.warn[aria-pressed="true"] { background:var(--warn); }

  .tl { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:12px; margin-top:13px; }
  .tl h2 { font-family:'Fira Code',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--faint); margin:0 0 10px; font-weight:500; }
  .ev { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .ev:last-child { border-bottom:none; }
  .ev .t { font-family:'Fira Code',monospace; font-size:10px; color:var(--faint); flex:0 0 46px; padding-top:2px; }
  .ev .b { flex:1; min-width:0; }
  .ev .what { font-size:12.8px; font-weight:600; line-height:1.4; }
  .ev .res { font-family:'Fira Code',monospace; font-size:11px; margin-top:3px; }
  .ev.ok .res { color:var(--ok); }
  .ev.bad .res { color:var(--bad); }
  .ev.warn .res { color:var(--warn); }
  .ev.dim .what, .ev.dim .res { color:var(--faint); }

  .row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:12px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .cell .k { font-family:'Fira Code',monospace; font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .cell .v { font-family:'Fira Code',monospace; font-size:13px; font-weight:600; margin-top:4px; line-height:1.35; }
  .cell.alarm { background:var(--bad-bg); border-color:var(--bad); } .cell.alarm .v { color:var(--bad); }
  .cell.good .v { color:var(--ok); }
  .cell.warn { background:var(--warn-bg); border-color:var(--warn); } .cell.warn .v { color:var(--warn); }

  .note { margin-top:13px; font-size:12.5px; line-height:1.68; color:var(--dim); border-left:2px solid var(--line); padding-left:12px; }
  .note b { color:var(--ink); font-weight:600; }
  .note code { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }
  .note.alarm { border-left-color:var(--bad); }
  .note.warn { border-left-color:var(--warn); }
  .note.fine { border-left-color:var(--ok); }
</style>
</head>
<body>

<h1>켜는 자리와 끄는 자리가 결과를 가른다</h1>
<p class="lead">음악을 들으며 뛰는 동안 1km 안내가 두 번 나가는 상황이다. 오디오 세션을 <b>어디서 켜고 어디서 끄느냐</b>에 따라 같은 코드가 정반대로 실패한다. 세 가지를 눌러 비교해보자.</p>

<div class="bar">
  <span>구현</span>
  <div class="seg" id="seg">
    <button type="button" class="danger" data-v="once" aria-pressed="true">시작 때 한 번만 켠다</button>
    <button type="button" class="warn" data-v="each" aria-pressed="false">말할 때마다 켜기만</button>
    <button type="button" data-v="pair" aria-pressed="false">켜고, 끝나면 끈다</button>
  </div>
</div>

<div class="row">
  <div class="cell"><div class="k">1km 안내</div><div class="v" id="v1">--</div></div>
  <div class="cell"><div class="k">2km 안내</div><div class="v" id="v2">--</div></div>
  <div class="cell"><div class="k">러닝 끝난 뒤 음악</div><div class="v" id="v3">--</div></div>
  <div class="cell"><div class="k">코드 위치</div><div class="v" id="v4">--</div></div>
</div>

<div class="tl">
  <h2>일어나는 일</h2>
  <div id="events"></div>
</div>
<div class="note" id="note"></div>

<script>
(function () {
  "use strict";
  var mode = "once";

  var DATA = {
    once: {
      v: ["안 들림", "안 들림", "정상", "start() 안"],
      cls: ["alarm", "alarm", "good", ""],
      ev: [
        ["0:00", "러닝 시작. 여기서 세션을 켠다", "덕킹 설정이 적용됨", "ok"],
        ["0:20", "음악 앱이 오디오를 가져감", "이 앱의 세션이 인터럽트됨", "bad"],
        ["5:30", "1km 안내 speak() 호출", "세션이 살아있지 않아 소리가 안 나감", "bad"],
        ["11:00", "2km 안내 speak() 호출", "같은 이유로 안 나감", "bad"],
        ["끝", "러닝 종료", "음악은 원래대로. 문제를 눈치채기 어렵다", "dim"]
      ],
      note: ["alarm", "세션을 <b>러닝 시작 때 한 번만</b> 켠 경우다. 오디오 세션은 앱이 독점하는 게 아니라 <b>여러 앱이 뺏고 뺏기는 자원</b>이다. 음악 앱이 한 번 가져가면 그 뒤로는 <code>speak()</code>를 아무리 불러도 소용이 없다. 게다가 <b>음악은 정상이라 사용자가 문제를 신고하기도 애매하다.</b>"]
    },
    each: {
      v: ["들림", "들림", "계속 작음", "speak() 직전"],
      cls: ["good", "good", "alarm", ""],
      ev: [
        ["0:00", "러닝 시작. 여기서도 세션을 켠다", "이 줄을 안 지운 게 화근", "warn"],
        ["0:00", "음악이 즉시 작아짐", "아직 아무 안내도 안 했는데", "bad"],
        ["5:30", "1km 안내 speak() 호출 직전에 또 켬", "안내는 정상적으로 들림", "ok"],
        ["11:00", "2km 안내도 정상", "여기까지는 고쳐진 것처럼 보인다", "ok"],
        ["끝", "러닝 종료", "푸는 코드가 없어 음악이 작은 채로 남는다", "bad"]
      ],
      note: ["warn", "안 들리던 문제를 고치려고 <b>말하기 직전마다 켜도록</b> 바꾼 상태다. 안내는 들리는데 <b>반대 방향으로 회귀했다.</b> 시작 시점의 켜는 코드를 안 지웠고, 푸는 코드도 없어서 러닝 내내 음악이 작아진 채로 돌아오지 않는다. <b>고친 방향은 맞았는데 짝이 되는 정리를 안 한 것</b>이다."]
    },
    pair: {
      v: ["들림", "들림", "정상", "speak() 직전 + didFinish"],
      cls: ["good", "good", "good", ""],
      ev: [
        ["0:00", "러닝 시작", "세션을 건드리지 않는다", "dim"],
        ["0:20", "음악 앱이 오디오를 가져감", "상관없다. 아직 말할 게 없다", "dim"],
        ["5:30", "1km 안내 직전에 세션 켬", "음악이 잠깐 작아지고 안내가 들림", "ok"],
        ["5:34", "didFinish 콜백에서 세션 끔", "음악이 원래 크기로 돌아옴", "ok"],
        ["11:00", "2km 안내도 같은 순서로", "켜고, 말하고, 끈다", "ok"],
        ["끝", "러닝 종료", "정리할 게 남아있지 않다", "ok"]
      ],
      note: ["fine", "지금 코드다. <b>켜는 자리와 끄는 자리가 짝을 이룬다.</b> 켜는 건 말하기 직전, 끄는 건 발화가 끝났다고 시스템이 알려주는 <code>didFinish</code> 콜백이다. 문장 길이가 매번 다르고 사용자가 도중에 뭘 재생할 수도 있어서, <b>끝났다는 사실을 시스템에게 듣는 게 유일하게 정확하다.</b>"]
    }
  };

  function render() {
    var d = DATA[mode];
    ["v1", "v2", "v3", "v4"].forEach(function (id, i) {
      var e = document.getElementById(id);
      e.textContent = d.v[i];
      e.parentElement.className = "cell" + (d.cls[i] ? " " + d.cls[i] : "");
    });
    document.getElementById("events").innerHTML = d.ev.map(function (e) {
      return '<div class="ev ' + e[3] + '"><div class="t">' + e[0] + '</div><div class="b">' +
             '<div class="what">' + e[1] + '</div><div class="res">' + e[2] + '</div></div></div>';
    }).join("");
    var n = document.getElementById("note");
    n.className = "note " + d.note[0];
    n.innerHTML = d.note[1];
  }

  document.querySelectorAll("#seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      mode = b.dataset.v;
      document.querySelectorAll("#seg button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
