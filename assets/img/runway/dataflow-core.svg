<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="GPS와 건강 데이터가 뷰모델을 거쳐 Actor로 모였다가 스트림으로 화면까지 흐르는 구조">
<style>
  :root { color-scheme: light dark; }
  .bg{fill:#ffffff}.card{fill:#f7f8fa;stroke:#e3e6ea}
  .actor{fill:#e2f4ef;stroke:#0d9276}.view{fill:#e8effc;stroke:#2563eb}
  .ttl{fill:#16181d;font-weight:700}.sub{fill:#6b7280}.dim{fill:#9aa1ab}
  .ok{fill:#0d9276}.acc{fill:#2563eb}.ln{stroke:#9aa1ab}.okl{stroke:#0d9276}
  text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d0e11}.card{fill:#141417;stroke:#27272a}
    .actor{fill:#0d2b23;stroke:#34d399}.view{fill:#14203a;stroke:#60a5fa}
    .ttl{fill:#f4f4f5}.sub{fill:#a1a1aa}.dim{fill:#71717a}
    .ok{fill:#34d399}.acc{fill:#60a5fa}.ln{stroke:#52525b}.okl{stroke:#34d399}
  }
</style>
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="dim"/></marker>
  <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="ok"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="720" height="250" rx="10"/>
<text class="dim" x="24" y="28" font-size="11">데이터가 흐르는 길</text>

<rect class="card" x="24" y="48" width="132" height="42" rx="8" stroke-width="1.3"/>
<text class="ttl" x="90" y="68" font-size="11.5" text-anchor="middle">LocationService</text>
<text class="dim" x="90" y="82" font-size="9" text-anchor="middle">GPS 위치</text>

<rect class="card" x="24" y="104" width="132" height="42" rx="8" stroke-width="1.3"/>
<text class="ttl" x="90" y="124" font-size="11.5" text-anchor="middle">HealthKitService</text>
<text class="dim" x="90" y="138" font-size="9" text-anchor="middle">심박 · 케이던스</text>

<line class="ln" x1="158" y1="69" x2="204" y2="88" stroke-width="1.4" marker-end="url(#ar)"/>
<line class="ln" x1="158" y1="125" x2="204" y2="106" stroke-width="1.4" marker-end="url(#ar)"/>

<rect class="card" x="210" y="76" width="104" height="42" rx="8" stroke-width="1.3"/>
<text class="ttl" x="262" y="96" font-size="11.5" text-anchor="middle">ViewModel</text>
<text class="dim" x="262" y="110" font-size="9" text-anchor="middle">받아서 넘겨줌</text>

<line class="ln" x1="316" y1="97" x2="366" y2="97" stroke-width="1.4" marker-end="url(#ar)"/>

<rect class="actor" x="372" y="62" width="150" height="70" rx="9" stroke-width="1.5"/>
<text class="ttl" x="447" y="86" font-size="12.5" text-anchor="middle">RunningCenter</text>
<text class="ok" x="447" y="102" font-size="10" text-anchor="middle">actor</text>
<text class="dim" x="447" y="119" font-size="9" text-anchor="middle">거리 · 페이스 · 경고 판정</text>

<line class="okl" x1="524" y1="97" x2="572" y2="97" stroke-width="1.8" marker-end="url(#ag)"/>
<text class="ok" x="548" y="86" font-size="8.5" text-anchor="middle">스트림</text>

<rect class="view" x="580" y="62" width="116" height="70" rx="9" stroke-width="1.5"/>
<text class="ttl" x="638" y="86" font-size="11.5" text-anchor="middle">ViewModel</text>
<text class="acc" x="638" y="102" font-size="10" text-anchor="middle">→ 화면</text>
<text class="dim" x="638" y="119" font-size="9" text-anchor="middle">받아서 보여주기만</text>

<line class="ln" x1="24" y1="168" x2="696" y2="168" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="24" y="190" font-size="11">계산은 전부 가운데 한 곳에서만 한다. 여러 갈래가 동시에 들어와도 여기서 한 줄로 세워 처리하기 때문이다.</text>
<text class="dim" x="24" y="210" font-size="10.5">Actor는 서비스를 직접 들고 있지 않다. 뷰모델이 받아다 넣어주고, 결과를 다시 뷰모델이 받아 간다.</text>
<text class="dim" x="24" y="230" font-size="10.5">그래서 Actor는 GPS가 어디서 오는지, 화면이 어떻게 생겼는지 몰라도 된다.</text>
</svg>
