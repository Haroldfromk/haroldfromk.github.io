<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="HealthKitService를 공통 파일과 플랫폼별 확장 파일로 나누고 타겟 멤버십으로 골라 담는 구조">
<style>
  :root { color-scheme: light dark; }
  .bg{fill:#ffffff}.card{fill:#f7f8fa;stroke:#e3e6ea}
  .ios{fill:#e8effc;stroke:#2563eb}.wat{fill:#e2f4ef;stroke:#0d9276}
  .ttl{fill:#16181d;font-weight:700}.sub{fill:#6b7280}.dim{fill:#9aa1ab}
  .acc{fill:#2563eb}.ok{fill:#0d9276}.ln{stroke:#9aa1ab}.accl{stroke:#2563eb}.okl{stroke:#0d9276}
  text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d0e11}.card{fill:#141417;stroke:#27272a}
    .ios{fill:#14203a;stroke:#60a5fa}.wat{fill:#0d2b23;stroke:#34d399}
    .ttl{fill:#f4f4f5}.sub{fill:#a1a1aa}.dim{fill:#71717a}
    .acc{fill:#60a5fa}.ok{fill:#34d399}.ln{stroke:#52525b}.accl{stroke:#60a5fa}.okl{stroke:#34d399}
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="250" rx="10"/>
<text class="dim" x="24" y="28" font-size="11">파일 세 개, 타겟 두 개</text>

<!-- 파일들 -->
<rect class="card" x="24" y="46" width="230" height="46" rx="8" stroke-width="1.3"/>
<text class="ttl" x="42" y="68" font-size="11">HealthKitService.swift</text>
<text class="dim" x="42" y="83" font-size="9.5">공통 · 세션, 빌더, 시작/종료</text>

<rect class="ios" x="24" y="104" width="230" height="46" rx="8" stroke-width="1.3"/>
<text class="ttl" x="42" y="126" font-size="11">HealthKitService+iOS.swift</text>
<text class="dim" x="42" y="141" font-size="9.5">아이폰 전용 · 미러링 수신, fetch</text>

<rect class="wat" x="24" y="162" width="230" height="46" rx="8" stroke-width="1.3"/>
<text class="ttl" x="42" y="184" font-size="11">HealthKitService+watchOS.swift</text>
<text class="dim" x="42" y="199" font-size="9.5">워치 전용 · 실시간 심박 스트림</text>

<!-- 연결선 -->
<line class="accl" x1="258" y1="66" x2="452" y2="86" stroke-width="1.5"/>
<line class="accl" x1="258" y1="124" x2="452" y2="100" stroke-width="1.5"/>
<line class="okl"  x1="258" y1="74" x2="452" y2="168" stroke-width="1.5"/>
<line class="okl"  x1="258" y1="182" x2="452" y2="182" stroke-width="1.5"/>

<!-- 타겟 -->
<rect class="ios" x="458" y="62" width="238" height="60" rx="9" stroke-width="1.5"/>
<text class="ttl" x="477" y="86" font-size="12">아이폰 앱 타겟</text>
<text class="acc" x="477" y="106" font-size="10">공통 + iOS 파일만 빌드된다</text>

<rect class="wat" x="458" y="146" width="238" height="60" rx="9" stroke-width="1.5"/>
<text class="ttl" x="477" y="170" font-size="12">워치 앱 타겟</text>
<text class="ok" x="477" y="190" font-size="10">공통 + watchOS 파일만 빌드된다</text>

<line class="ln" x1="24" y1="224" x2="696" y2="224" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="24" y="244" font-size="11">파일마다 어느 타겟에 속할지만 정해두면, 코드 안에서 "지금 아이폰인가 워치인가"를 따질 필요가 없어진다.</text>
</svg>
