<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="미러링 범위를 좁히는 결정: 네 경우 중 워치 주도 미러링만 잘라낸다">
<style>
  :root { color-scheme: light dark; }
  .bg   { fill: #ffffff; }
  .cell { fill: #f7f8fa; stroke: #e3e6ea; }
  .keep { fill: #e2f4ef; stroke: #0d9276; }
  .cut  { fill: #fbeae8; stroke: #d0392b; }
  .ttl  { fill: #16181d; font-weight: 700; }
  .sub  { fill: #6b7280; }
  .dim  { fill: #9aa1ab; }
  .ok   { fill: #0d9276; }
  .bad  { fill: #d0392b; }
  .ln   { stroke: #9aa1ab; }
  .cutln{ stroke: #d0392b; }
  text  { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d0e11; }
    .cell { fill: #141417; stroke: #27272a; }
    .keep { fill: #0d2b23; stroke: #34d399; }
    .cut  { fill: #331416; stroke: #f87171; }
    .ttl  { fill: #f4f4f5; }
    .sub  { fill: #a1a1aa; }
    .dim  { fill: #71717a; }
    .ok   { fill: #34d399; }
    .bad  { fill: #f87171; }
    .ln   { stroke: #52525b; }
    .cutln{ stroke: #f87171; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="300" rx="10"/>

<text class="dim" x="24" y="30" font-size="11">러닝을 시작할 수 있는 네 가지 경우</text>

<!-- 축 라벨 -->
<text class="sub" x="196" y="66" font-size="10.5" text-anchor="middle">아이폰이 시작</text>
<text class="sub" x="404" y="66" font-size="10.5" text-anchor="middle">워치가 시작</text>
<text class="sub" x="150" y="106" font-size="10.5" text-anchor="end">단독</text>
<text class="sub" x="150" y="196" font-size="10.5" text-anchor="end">미러링</text>

<!-- 1행: 단독 -->
<rect class="keep" x="160" y="80" width="176" height="66" rx="9" stroke-width="1.4"/>
<text class="ttl" x="248" y="106" font-size="12" text-anchor="middle">아이폰 단독</text>
<text class="ok"  x="248" y="126" font-size="10" text-anchor="middle">유지</text>

<rect class="keep" x="352" y="80" width="176" height="66" rx="9" stroke-width="1.4"/>
<text class="ttl" x="440" y="106" font-size="12" text-anchor="middle">워치 단독</text>
<text class="ok"  x="440" y="126" font-size="10" text-anchor="middle">유지</text>

<!-- 2행: 미러링 -->
<rect class="keep" x="160" y="162" width="176" height="66" rx="9" stroke-width="1.4"/>
<text class="ttl" x="248" y="188" font-size="12" text-anchor="middle">아이폰 주도 미러링</text>
<text class="ok"  x="248" y="208" font-size="10" text-anchor="middle">유지 · 심박이 필요하니까</text>

<rect class="cut" x="352" y="162" width="176" height="66" rx="9" stroke-width="1.4"/>
<line class="cutln" x1="366" y1="222" x2="514" y2="170" stroke-width="1.6" opacity="0.55"/>
<text class="ttl" x="440" y="188" font-size="12" text-anchor="middle">워치 주도 미러링</text>
<text class="bad" x="440" y="210" font-size="10" text-anchor="middle" font-weight="700">잘라냄</text>

<!-- 오른쪽 근거 -->
<line class="ln" x1="552" y1="76" x2="552" y2="232" stroke-width="1" stroke-dasharray="3 3"/>
<text class="dim" x="570" y="92" font-size="10">고친 버그가 나온 곳</text>
<text class="bad" x="570" y="116" font-size="10.5">· 앱 종료 시 지도 안 나옴</text>
<text class="bad" x="570" y="136" font-size="10.5">· 종료 이벤트 중복 발행</text>
<text class="bad" x="570" y="156" font-size="10.5">· 워치 GPS가 안 멈춤</text>
<text class="bad" x="570" y="176" font-size="10.5">· 다이나믹 아일랜드 멈춤</text>
<text class="dim" x="570" y="204" font-size="10">전부 이 한 칸에서 나왔다</text>

<line class="ln" x1="24" y1="252" x2="696" y2="252" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="24" y="274" font-size="11">버그를 몇 개 고쳤는지가 아니라 어디서 나왔는지를 세어봤더니, 한 칸에 몰려 있었다.</text>
<text class="dim" x="24" y="290" font-size="10.5">남은 걸 다 고쳐도 비슷한 게 또 나올 거라는 신호로 봤다.</text>
</svg>
