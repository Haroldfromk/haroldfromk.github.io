<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="RunWay 첫날 설계한 세 가지 모델과 관계">
<style>
  :root { color-scheme: light dark; }
  .bg   { fill: #ffffff; }
  .card { fill: #f7f8fa; stroke: #e3e6ea; }
  .card2{ fill: #e8effc; stroke: #2563eb; }
  .card3{ fill: #e2f4ef; stroke: #0d9276; }
  .ttl  { fill: #16181d; font-weight: 700; }
  .sub  { fill: #6b7280; }
  .dim  { fill: #9aa1ab; }
  .ln   { stroke: #9aa1ab; }
  .acc  { fill: #2563eb; }
  .acc2 { fill: #0d9276; }
  text  { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d0e11; }
    .card { fill: #141417; stroke: #27272a; }
    .card2{ fill: #14203a; stroke: #60a5fa; }
    .card3{ fill: #0d2b23; stroke: #34d399; }
    .ttl  { fill: #f4f4f5; }
    .sub  { fill: #a1a1aa; }
    .dim  { fill: #71717a; }
    .ln   { stroke: #52525b; }
    .acc  { fill: #60a5fa; }
    .acc2 { fill: #34d399; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="330" rx="10"/>

<text class="dim" x="24" y="30" font-size="11">Day 1 — 코드보다 먼저 정한 것</text>

<!-- Flight -->
<rect class="card" x="24" y="48" width="248" height="196" rx="10" stroke-width="1.4"/>
<text class="ttl" x="42" y="76" font-size="15">Flight</text>
<text class="sub" x="42" y="94" font-size="10.5">러닝 한 번의 기록</text>
<line class="ln" x1="42" y1="106" x2="254" y2="106" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="42" y="126" font-size="11">distance   거리 (km)</text>
<text class="sub" x="42" y="145" font-size="11">time       시간 (초)</text>
<text class="sub" x="42" y="164" font-size="11">pace       페이스 (분/km)</text>
<text class="sub" x="42" y="183" font-size="11">heartRate  심박 (bpm)</text>
<text class="sub" x="42" y="202" font-size="11">cadence    케이던스 (spm)</text>
<text class="sub" x="42" y="221" font-size="11">fuel       칼로리</text>

<!-- mode 분기 -->
<text class="acc" x="42" y="266" font-size="11.5" font-weight="600">mode</text>
<line class="ln" x1="82" y1="262" x2="120" y2="262" stroke-width="1.2"/>
<rect class="card2" x="124" y="248" width="76" height="26" rx="6" stroke-width="1.2"/>
<text class="acc" x="162" y="265" font-size="10.5" text-anchor="middle" font-weight="600">modeA</text>
<rect class="card" x="208" y="248" width="76" height="26" rx="6" stroke-width="1.2"/>
<text class="sub" x="246" y="265" font-size="10.5" text-anchor="middle">modeB</text>
<text class="dim" x="42" y="296" font-size="10">기록의 성격이 달라서 나눠뒀다</text>

<!-- 화살표 -->
<defs>
  <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 z" class="acc"/>
  </marker>
</defs>
<line class="ln" x1="200" y1="261" x2="316" y2="150" stroke-width="1.4" marker-end="url(#a1)" stroke-dasharray="4 3"/>

<!-- ModeA -->
<rect class="card2" x="324" y="98" width="170" height="104" rx="10" stroke-width="1.4"/>
<text class="ttl" x="342" y="126" font-size="15">ModeA</text>
<text class="sub" x="342" y="144" font-size="10.5">그 러닝의 목표 설정</text>
<line class="ln" x1="342" y1="156" x2="476" y2="156" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="342" y="176" font-size="11">targetPace</text>
<text class="sub" x="342" y="193" font-size="11">paceDeviation</text>

<!-- Aircraft -->
<rect class="card3" x="524" y="48" width="172" height="196" rx="10" stroke-width="1.4"/>
<text class="ttl" x="542" y="76" font-size="15">Aircraft</text>
<text class="sub" x="542" y="94" font-size="10.5">유저 = 한 대의 항공기</text>
<line class="ln" x1="542" y1="106" x2="678" y2="106" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="542" y="126" font-size="11">name   기체명</text>
<text class="sub" x="542" y="145" font-size="11">model  기종</text>
<text class="sub" x="542" y="164" font-size="11">height / weight</text>
<text class="sub" x="542" y="183" font-size="11">age / gender</text>
<line class="ln" x1="542" y1="197" x2="678" y2="197" stroke-width="1" stroke-dasharray="3 3"/>
<text class="acc2" x="542" y="217" font-size="10.5">여기서 BMI와</text>
<text class="acc2" x="542" y="232" font-size="10.5">최대 심박(220-나이)이 나온다</text>

<text class="dim" x="324" y="230" font-size="10.5">ModeB는 따로 모델을 안 만들었다.</text>
<text class="dim" x="324" y="246" font-size="10.5">자유 러닝이라 Flight 하나로 충분해서다.</text>
</svg>
