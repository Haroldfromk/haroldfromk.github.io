<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="화면이 스트림을 미리 열어두고, 위치가 들어올 때마다 Actor가 그 스트림으로 FlightData를 흘려보내는 왕복 구조">
<style>
  :root { color-scheme: light dark; }
  .bg{fill:#ffffff}.card{fill:#f7f8fa;stroke:#e3e6ea}
  .actor{fill:#e2f4ef;stroke:#0d9276}.view{fill:#e8effc;stroke:#2563eb}
  .ttl{fill:#16181d;font-weight:700}.sub{fill:#6b7280}.dim{fill:#9aa1ab}
  .ok{fill:#0d9276}.acc{fill:#2563eb}.ln{stroke:#9aa1ab}.okl{stroke:#0d9276}.accl{stroke:#2563eb}
  text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d0e11}.card{fill:#141417;stroke:#27272a}
    .actor{fill:#0d2b23;stroke:#34d399}.view{fill:#14203a;stroke:#60a5fa}
    .ttl{fill:#f4f4f5}.sub{fill:#a1a1aa}.dim{fill:#71717a}
    .ok{fill:#34d399}.acc{fill:#60a5fa}.ln{stroke:#52525b}.okl{stroke:#34d399}.accl{stroke:#60a5fa}
  }
</style>
<defs>
  <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="acc"/></marker>
  <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="ok"/></marker>
  <marker id="b3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="dim"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="720" height="250" rx="10"/>

<text class="acc" x="24" y="30" font-size="10.5" font-weight="700">① 화면이 뜰 때 한 번만</text>
<rect class="view" x="24" y="40" width="128" height="42" rx="8" stroke-width="1.4"/>
<text class="ttl" x="88" y="59" font-size="11" text-anchor="middle">화면 (.task)</text>
<text class="dim" x="88" y="73" font-size="9" text-anchor="middle">startStream()</text>
<line class="accl" x1="154" y1="61" x2="354" y2="61" stroke-width="1.6" marker-end="url(#b1)"/>
<text class="acc" x="254" y="52" font-size="9.5" text-anchor="middle">스트림을 열어두고 기다린다</text>

<rect class="actor" x="360" y="40" width="176" height="112" rx="9" stroke-width="1.5"/>
<text class="ttl" x="448" y="64" font-size="12" text-anchor="middle">RunningCenter</text>
<text class="dim" x="448" y="80" font-size="9" text-anchor="middle">continuation 을 들고 있음</text>
<line class="ln" x1="378" y1="92" x2="518" y2="92" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="448" y="112" font-size="10" text-anchor="middle">processLocation()</text>
<text class="ok" x="448" y="132" font-size="10.5" text-anchor="middle">yield(FlightData)</text>

<text class="ok" x="24" y="104" font-size="10.5" font-weight="700">② 위치가 들어올 때마다</text>
<rect class="card" x="24" y="114" width="128" height="40" rx="8" stroke-width="1.3"/>
<text class="ttl" x="88" y="132" font-size="10.5" text-anchor="middle">LocationService</text>
<text class="dim" x="88" y="146" font-size="9" text-anchor="middle">locationPublisher</text>
<line class="ln" x1="154" y1="134" x2="200" y2="134" stroke-width="1.4" marker-end="url(#b3)"/>
<rect class="card" x="206" y="114" width="104" height="40" rx="8" stroke-width="1.3"/>
<text class="ttl" x="258" y="138" font-size="11" text-anchor="middle">ViewModel</text>
<line class="ln" x1="312" y1="132" x2="354" y2="118" stroke-width="1.4" marker-end="url(#b3)"/>

<path class="okl" d="M 448 154 L 448 184 L 12 184 L 12 61 L 18 61" fill="none" stroke-width="1.8" marker-end="url(#b2)"/>
<text class="ok" x="286" y="176" font-size="9.5" text-anchor="middle">③ 열어둔 스트림을 타고 화면까지 그대로 흘러간다</text>

<line class="ln" x1="24" y1="206" x2="696" y2="206" stroke-width="1" stroke-dasharray="3 3"/>
<text class="sub" x="24" y="228" font-size="11">스트림을 여는 건 ①에서 한 번뿐이고, 그 뒤로는 이미 열려 있는 통로로 값만 계속 흘려보낸다.</text>
<text class="dim" x="24" y="244" font-size="10.5">이걸 몰라서 처음엔 위치가 올 때마다 스트림을 새로 만들고 있었다.</text>
</svg>
