<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="브라우저 탭과 iOS 앱이 각각 서버에 연결을 맺고, 한 명이 보낸 메시지를 서버가 나머지 모두에게 다시 보내주는 구조">
<style>
  :root { color-scheme: light dark; }
  .bg{fill:#ffffff}.card{fill:#f7f8fa;stroke:#e3e6ea}
  .srv{fill:#e2f4ef;stroke:#0d9276}.send{fill:#e8effc;stroke:#2563eb}
  .ttl{fill:#16181d;font-weight:700}.sub{fill:#6b7280}.dim{fill:#9aa1ab}
  .ok{fill:#0d9276}.acc{fill:#2563eb}
  .ln{stroke:#9aa1ab}.okl{stroke:#0d9276}.acl{stroke:#2563eb}
  text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d0e11}.card{fill:#141417;stroke:#27272a}
    .srv{fill:#0d2b23;stroke:#34d399}.send{fill:#14203a;stroke:#60a5fa}
    .ttl{fill:#f4f4f5}.sub{fill:#a1a1aa}.dim{fill:#71717a}
    .ok{fill:#34d399}.acc{fill:#60a5fa}
    .ln{stroke:#52525b}.okl{stroke:#34d399}.acl{stroke:#60a5fa}
  }
</style>
<defs>
  <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="ok"/></marker>
  <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="acc"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="720" height="320" rx="10"/>

<text class="sub" x="24" y="30" font-size="11" font-weight="700">메시지가 건너가는 길</text>
<text class="dim" x="24" y="46" font-size="9">손님끼리는 직접 만나지 않는다. 전부 서버를 거친다</text>

<!-- 보내는 사람 -->
<rect class="send" x="24" y="70" width="150" height="50" rx="9" stroke-width="1.5"/>
<text class="ttl" x="99" y="90" font-size="11" text-anchor="middle">브라우저 탭 1</text>
<text class="acc" x="99" y="106" font-size="9" text-anchor="middle">해롤드: 안녕하세요</text>

<!-- 서버 -->
<rect class="srv" x="286" y="128" width="148" height="64" rx="10" stroke-width="1.6"/>
<text class="ttl" x="360" y="152" font-size="11.5" text-anchor="middle">Hummingbird</text>
<text class="ok" x="360" y="168" font-size="9" text-anchor="middle">받은 글을 그대로</text>
<text class="ok" x="360" y="181" font-size="9" text-anchor="middle">모두에게 다시 보냄</text>

<!-- 받는 사람들 -->
<rect class="card" x="546" y="60" width="150" height="46" rx="9" stroke-width="1.3"/>
<text class="ttl" x="621" y="79" font-size="11" text-anchor="middle">브라우저 탭 1</text>
<text class="dim" x="621" y="94" font-size="9" text-anchor="middle">보낸 사람도 같이 받음</text>

<rect class="card" x="546" y="137" width="150" height="46" rx="9" stroke-width="1.3"/>
<text class="ttl" x="621" y="156" font-size="11" text-anchor="middle">브라우저 탭 2</text>
<text class="dim" x="621" y="171" font-size="9" text-anchor="middle">다른 사람</text>

<rect class="card" x="546" y="214" width="150" height="46" rx="9" stroke-width="1.3"/>
<text class="ttl" x="621" y="233" font-size="11" text-anchor="middle">iOS 앱</text>
<text class="dim" x="621" y="248" font-size="9" text-anchor="middle">브라우저와 같은 손님</text>

<!-- 보내는 화살표 -->
<path class="acl" d="M174,95 C220,95 240,140 282,152" fill="none" stroke-width="1.8" marker-end="url(#b2)"/>
<text class="acc" x="206" y="142" font-size="9" text-anchor="middle">보냄</text>

<!-- 뿌리는 화살표 -->
<path class="okl" d="M438,150 C480,140 500,92 542,84" fill="none" stroke-width="1.6" marker-end="url(#b1)"/>
<path class="okl" d="M438,160 L542,160" fill="none" stroke-width="1.6" marker-end="url(#b1)"/>
<path class="okl" d="M438,172 C480,182 500,228 542,237" fill="none" stroke-width="1.6" marker-end="url(#b1)"/>
<text class="ok" x="488" y="153" font-size="9" text-anchor="middle">뿌림</text>

<text class="sub" x="360" y="292" font-size="9.5" text-anchor="middle">연결은 손님마다 하나씩. 서버는 그 연결들을 명단으로 들고 있다가 한꺼번에 보낸다</text>
</svg>
